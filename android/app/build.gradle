plugins {
    id 'com.android.application'
}
android {
    namespace 'com.refillshop.cuba'
    compileSdk 35
    defaultConfig {
        applicationId 'com.refillshop.cuba'
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName '1.2.0'
    }
    buildTypes {
        release { minifyEnabled false }
        debug { debuggable true }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
