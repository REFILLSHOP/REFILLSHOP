function refillcoinsView(){const u=currentUser();if(!u)return accountGate('RefillCoins');const invites=db.users.filter(x=>x.invitedBy===u.id);const led=userCoinsLedger(u).slice(0,8);return `<section class="rewards-hero"><div><span class="eyebrow">PROGRAMA DE RECOMPENSAS</span><h1>Compra. Gana.<br><span style="color:#8bd5ff">Vuelve a jugar.</span></h1><p>Por cada dólar acumulado en compras completadas ganas ${Number(db.loyalty.coinsPerUsd)} RefillCoin(s). Los depósitos no generan monedas y los pedidos pendientes no cuentan.</p><div class="hero-buttons"><button class="btn btn-primary" onclick="navigate('ruleta')">🎡 Ir a la ruleta</button><button class="btn btn-secondary" onclick="navigate('especiales')">🎁 Ofertas especiales</button></div></div><div class="coin-big"><div><span>TU SALDO</span><strong>${db.coins}</strong><span>REFILLCOINS</span></div><div style="font-size:34px">💠</div></div></section><div class="loyalty-grid"><article class="loyalty-item"><span class="loyalty-icon">🛒</span><h3>Gana comprando</h3><p>Las monedas se acreditan cuando el pedido se marca como completado. Se acumula el gasto para contar cada dólar entero.</p><button class="btn btn-secondary btn-small" onclick="navigate('ofertas')">Ver ofertas</button></article><article class="loyalty-item"><span class="loyalty-icon">🎡</span><h3>Ruleta de premios</h3><p>Utiliza ${db.loyalty.rouletteCost} RefillCoins por giro y descubre si ganas monedas extra o un cupón.</p><button class="btn btn-secondary btn-small" onclick="navigate('ruleta')">Probar suerte</button></article><article class="loyalty-item"><span class="loyalty-icon">👥</span><h3>Invita a tus amigos</h3><p>Tu código da ${db.loyalty.referralInviterCoins} monedas al invitador y ${db.loyalty.referralFriendCoins} al amigo cuando alcance el gasto mínimo.</p><button class="btn btn-secondary btn-small" onclick="navigate('cuenta')">Mi código</button></article></div><section class="panel subsection"><h3>Últimos movimientos de RefillCoins</h3>${led.length?led.map(x=>`<div class="coin-ledger-row"><span>${esc(x.description)}<small>${esc(x.date||'')}</small></span><b style="color:${x.amount>=0?'#58ddb4':'#ff8296'}">${x.amount>0?'+':''}${x.amount} RC</b></div>`).join(''):empty('💠','Tus monedas y premios aparecerán aquí.')}</section><div class="notice" style="margin-top:14px">${cash(userSpendForAccount(u))} en compras completadas acumuladas · ${Math.floor(userSpendForAccount(u))} USD enteros contabilizados.</div>`}
function rouletteView(){if(!currentUser())return accountGate('Ruleta de premios');const u=currentUser(),cost=Number(db.loyalty.rouletteCost)||10;const history=(db.rouletteHistory||[]).slice(0,5);return `<span class="eyebrow">REFILLS ARCADE</span><h1 class="page-title">Ruleta de premios</h1><p class="page-desc">Gasta RefillCoins acumulados y consigue monedas extra o cupones para tus recargas.</p><div class="wheel-wrap"><div><div id="rouletteWheel" class="wheel"></div><button class="btn btn-primary" style="width:100%;margin-top:25px" onclick="spinRoulette()">🎡 Girar · ${cost} RC</button><p class="muted" style="font-size:10px;text-align:center">Tu saldo: ${db.coins} RefillCoins</p></div><section class="reward-card"><span class="eyebrow">PREMIOS POSIBLES</span><h2>¿Qué puedes conseguir?</h2><p>Cada giro cuesta RefillCoins ganados por actividad; no acepta dinero ni añade monedas compradas.</p><div class="roulette-prizes"><div class="roulette-prize">🌫️ <span><b>Sin premio</b> · el giro cuesta el saldo indicado</span></div><div class="roulette-prize">💠 <span><b>+3 RefillCoins</b> · suma monedas a tu cuenta</span></div><div class="roulette-prize">💠 <span><b>+5 RefillCoins</b> · premio frecuente</span></div><div class="roulette-prize">🎟️ <span><b>Cupón 5%</b> · descuento personal</span></div><div class="roulette-prize">💎 <span><b>+15 RefillCoins</b> · premio especial</span></div></div>${history.length?`<section class="panel subsection"><h3>Últimos giros</h3>${history.map(h=>`<div class="coin-ledger-row"><span>${esc(h.prize)}<small>${esc(h.date)}</small></span><b>${h.cost} RC</b></div>`).join('')}</section>`:''}</section></div>`}
function spinRoulette(){if(!requireAccount())return;if(db.rouletteSpinning)return;const cost=Math.max(1,Number(db.loyalty.rouletteCost)||10);if(db.coins<cost)return toast('No tienes suficientes RefillCoins');db.rouletteSpinning=true;addCoinLedger(-cost,'Giro de ruleta', 'roulette-'+Date.now());persist();const wheel=document.getElementById('rouletteWheel');if(wheel)wheel.classList.add('spinning');const candidates=[{label:'Sin premio',type:'none',value:0,weight:35},{label:'+3 RefillCoins',type:'coins',value:3,weight:25},{label:'+5 RefillCoins',type:'coins',value:5,weight:20},{label:'Cupón personal del 5%',type:'coupon',value:5,weight:15},{label:'+15 RefillCoins',type:'coins',value:15,weight:5}];const roll=Math.random()*candidates.reduce((n,x)=>n+x.weight,0);let acc=0,prize=candidates[0];for(const p of candidates){acc+=p.weight;if(roll<acc){prize=p;break}}setTimeout(()=>{db.rouletteSpinning=false;if(prize.type==='coins')addCoinLedger(prize.value,'Premio de ruleta: '+prize.label,'roulette-reward-'+Date.now());if(prize.type==='coupon'){const code=createPersonalCoupon(prize.value,'RU');prize.label+=' · '+code;}const h={prize:prize.label,cost,date:new Date().toLocaleString('es-ES')};db.rouletteHistory.unshift(h);persist();render();toast('Resultado de la ruleta: '+prize.label)},1450)}
function addCoinLedger(amount,description,reference=''){const row={id:'RC-'+Date.now().toString(36),ts:Date.now(),date:new Date().toLocaleString('es-ES'),description,amount:Number(amount),balanceAfter:Number(db.coins||0)+Number(amount),reference};db.coins=Number((Number(db.coins||0)+Number(amount)).toFixed(0));row.balanceAfter=db.coins;db.coinLedger=db.coinLedger||[];db.coinLedger.unshift(row);}
function grantCoinsToUser(userId,amount,description,reference=''){amount=Math.floor(Number(amount)||0);if(amount<=0)return;const u=db.users.find(x=>x.id===userId);if(!u)return;if(userId===db.sessionUserId){addCoinLedger(amount,description,reference);return}u.coins=Number(u.coins||0)+amount;u.coinLedger=u.coinLedger||[];u.coinLedger.unshift({id:'RC-'+Date.now().toString(36),ts:Date.now(),date:new Date().toLocaleString('es-ES'),description,amount,balanceAfter:u.coins,reference})}
function createPersonalCoupon(percent,prefix='RC'){const u=currentUser();if(!u)return '';const code=prefix+'-'+u.referralCode.slice(-4)+'-'+Math.random().toString(36).slice(2,6).toUpperCase();db.coupons.push({code,percent:Number(percent),active:true,userId:u.id});return code}
function specialOffersView(){if(!currentUser())return accountGate('Ofertas especiales');const list=(db.specialOffers||[]).filter(o=>o.active);return `<span class="eyebrow">TIENDA DE RECOMPENSAS</span><h1 class="page-title">Ofertas especiales</h1><p class="page-desc">Canjea tus RefillCoins por saldo de Wallet o cupones personales. Estos premios no se compran con dinero.</p><div class="rewards-hero" style="margin-top:22px"><div><span class="eyebrow">TU SALDO DE CANJEO</span><h1>${db.coins} <span style="color:#9bdcff">RefillCoins</span></h1><p>Escoge un premio y confirma el canje. Los RefillCoins se descuentan de inmediato en esta demo.</p></div><div class="hero-buttons"><button class="btn btn-primary" onclick="navigate('refillcoins')">Ver recompensas</button></div></div><section class="panel subsection"><h3>Tus cupones personales</h3>${db.coupons.filter(c=>c.userId===u.id&&c.active).length?db.coupons.filter(c=>c.userId===u.id&&c.active).map(c=>`<div class="coin-ledger-row"><span><b>${esc(c.code)}</b><small>${Number(c.percent)}% de descuento · solo para esta cuenta</small></span><button class="filter-chip" onclick="copyText('${esc(c.code)}')">Copiar</button></div>`).join(''):empty('🎟️','Los cupones que ganes o canjees aparecerán aquí.')}</section><div class="loyalty-grid">${list.map(o=>`<article class="loyalty-item"><span class="loyalty-icon">${o.type==='wallet'?'💰':'🎟️'}</span><span class="coupon-badge">${o.coinCost} RC</span><h3>${esc(o.name)}</h3><p>${esc(o.description||'Oferta exclusiva para miembros.')}</p><p><b style="color:#9bdcff">${o.type==='wallet'?cash(o.value)+' de saldo':Number(o.value)+'% de descuento'}</b></p><button class="btn btn-primary btn-small" onclick="redeemSpecialOffer('${o.id}')">Canjear por ${o.coinCost} RC</button></article>`).join('')||empty('🎁','No hay ofertas especiales activas ahora mismo.')}</div>`}
function redeemSpecialOffer(id){if(!requireAccount())return;const o=db.specialOffers.find(x=>x.id===id&&x.active);if(!o)return toast('La oferta ya no está disponible');if(db.coins<o.coinCost)return toast('No tienes suficientes RefillCoins');if(!confirm(`¿Canjear ${o.coinCost} RefillCoins por «${o.name}»?`))return;addCoinLedger(-o.coinCost,'Canje: '+o.name,'redeem-'+Date.now());let rewardCode='';if(o.type==='wallet'){db.balance=Number((db.balance+Number(o.value)).toFixed(2));db.ledger.unshift({ts:Date.now(),date:new Date().toLocaleString('es-ES'),description:'Premio RefillCoins: '+o.name,type:'Crédito',amount:Number(o.value),balanceAfter:db.balance})}else{rewardCode=createPersonalCoupon(Number(o.value),'COIN');}persist();render();toast(rewardCode?'Canje completado · cupón '+rewardCode:'Premio canjeado correctamente')}
function accountGate(label){return `<section class="login-card"><span class="eyebrow">REFILLS SHOP · CUENTA</span><h1>${esc(label)}</h1><p>Inicia sesión o crea una cuenta para usar esta sección y guardar tu actividad.</p><button class="btn btn-primary" onclick="navigate('cuenta')">Crear cuenta / Entrar ↗</button></section>`}
function saveLoyaltySettings(e){e.preventDefault();const coinsPerUsd=Number(document.getElementById('loyCoinsPerUsd').value),rouletteCost=Number(document.getElementById('loyRouletteCost').value),referrer=Number(document.getElementById('loyReferrer').value),friend=Number(document.getElementById('loyFriend').value),minSpend=Number(document.getElementById('loyMinSpend').value);if(![coinsPerUsd,rouletteCost,referrer,friend,minSpend].every(Number.isFinite)||coinsPerUsd<1||coinsPerUsd>100||!Number.isInteger(coinsPerUsd)||rouletteCost<1||referrer<0||friend<0||minSpend<0)return toast('Revisa los valores de recompensas');db.loyalty={...db.loyalty,coinsPerUsd,rouletteCost,referralInviterCoins:referrer,referralFriendCoins:friend,referralMinSpend:minSpend};persist();render();toast('Reglas de RefillCoins guardadas')}
function adminLoyalty(){const l=db.loyalty;return `<div class="section-head"><div><h2>RefillCoins y recompensas</h2><p>Define cómo se ganan, cómo se gastan y qué recompensa reciben los usuarios invitados.</p></div></div><section class="panel"><form onsubmit="saveLoyaltySettings(event)"><div class="form-grid"><label class="field"><span>RefillCoins por cada USD acumulado</span><input id="loyCoinsPerUsd" type="number" min="1" max="100" step="1" value="${l.coinsPerUsd}" required></label><label class="field"><span>Coste de un giro de ruleta (RC)</span><input id="loyRouletteCost" type="number" min="1" step="1" value="${l.rouletteCost}" required></label><label class="field"><span>Recompensa para quien invita (RC)</span><input id="loyReferrer" type="number" min="0" step="1" value="${l.referralInviterCoins}" required></label><label class="field"><span>Recompensa para el amigo (RC)</span><input id="loyFriend" type="number" min="0" step="1" value="${l.referralFriendCoins}" required></label><label class="field"><span>Gasto mínimo completado para activar invitación (USD)</span><input id="loyMinSpend" type="number" min="0" step="0.5" value="${l.referralMinSpend}" required></label></div><button class="btn btn-primary" type="submit">Guardar reglas de recompensas</button></form><p class="security-note">Las monedas se acreditan solamente cuando un pedido pasa a Completado. Los depósitos de Wallet no generan monedas. La ruleta usa monedas ganadas, no pagos en dinero real.</p></section><div class="section-head"><div><h2>Canjes disponibles</h2><p>Gestiona las ofertas que se compran con RefillCoins.</p></div><button class="btn btn-primary btn-small" onclick="editSpecialOffer()">＋ Nueva recompensa</button></div><section class="panel"><div class="table-scroll"><table class="list-table"><thead><tr><th>RECOMPENSA</th><th>COSTE</th><th>PREMIO</th><th>ESTADO</th><th>ACCIONES</th></tr></thead><tbody>${(db.specialOffers||[]).map(o=>`<tr><td><b>${esc(o.name)}</b><br><small class="muted">${esc(o.description||'')}</small></td><td>${o.coinCost} RC</td><td>${o.type==='wallet'?cash(o.value)+' Wallet':Number(o.value)+'% cupón'}</td><td>${statusBadge(o.active?'Completado':'Pausado')}</td><td><div class="admin-action-row"><button class="filter-chip" onclick="editSpecialOffer('${o.id}')">Editar</button><button class="filter-chip" onclick="toggleSpecialOffer('${o.id}')">${o.active?'Pausar':'Activar'}</button><button class="filter-chip danger-chip" onclick="deleteSpecialOffer('${o.id}')">Eliminar</button></div></td></tr>`).join('')}</tbody></table></div></section>`}
function editSpecialOffer(id){const o=id?db.specialOffers.find(x=>x.id===id):null;modal(`<span class="eyebrow">RECOMPENSA DE PUNTOS</span><h2>${o?'Editar recompensa':'Crear recompensa'}</h2><form onsubmit="saveSpecialOffer(event,${o?`'${o.id}'`:'null'})"><label class="field"><span>Nombre visible</span><input id="spName" maxlength="70" required value="${esc(o?.name||'')}"></label><label class="field"><span>Descripción</span><textarea id="spDesc" maxlength="180">${esc(o?.description||'')}</textarea></label><div class="form-grid"><label class="field"><span>Coste en RefillCoins</span><input id="spCost" type="number" min="1" step="1" required value="${o?.coinCost??50}"></label><label class="field"><span>Tipo de premio</span><select id="spType"><option value="wallet" ${o?.type!=='coupon'?'selected':''}>Crédito Wallet (USD)</option><option value="coupon" ${o?.type==='coupon'?'selected':''}>Cupón de descuento (%)</option></select></label></div><label class="field"><span>Valor (USD o porcentaje, según tipo)</span><input id="spValue" type="number" min="0.01" step="0.01" required value="${o?.value??0.5}"></label><button class="btn btn-primary" type="submit">Guardar recompensa</button></form>`)}
function saveSpecialOffer(e,id){e.preventDefault();const data={name:document.getElementById('spName').value.trim(),description:document.getElementById('spDesc').value.trim(),coinCost:Math.floor(Number(document.getElementById('spCost').value)),type:document.getElementById('spType').value,value:Number(document.getElementById('spValue').value),active:id?Boolean(db.specialOffers.find(x=>x.id===id)?.active):true};if(!data.name||data.coinCost<1||!Number.isFinite(data.value)||data.value<=0||(data.type==='coupon'&&data.value>80))return toast('Comprueba los datos de la recompensa');if(id)Object.assign(db.specialOffers.find(x=>x.id===id),data);else db.specialOffers.push({id:'special-'+Date.now(),...data});persist();closeModal();render();toast('Recompensa guardada')}
function toggleSpecialOffer(id){const o=db.specialOffers.find(x=>x.id===id);if(!o)return;o.active=!o.active;persist();render();toast(o.active?'Recompensa activada':'Recompensa pausada')}
function deleteSpecialOffer(id){if(!confirm('¿Eliminar esta recompensa?'))return;db.specialOffers=db.specialOffers.filter(x=>x.id!==id);persist();render();toast('Recompensa eliminada')}
function adminUsers(){return `<div class="section-head"><div><h2>Cuentas registradas</h2><p>Vista local de los usuarios creados en este navegador. Nunca se muestra el PIN.</p></div><span class="coupon-badge">${db.users.length} cuentas</span></div><section class="panel">${db.users.length?`<div class="table-scroll"><table class="list-table"><thead><tr><th>USUARIO</th><th>TELÉFONO</th><th>INVITACIÓN</th><th>GASTO ACUMULADO</th><th>REFILLCOINS</th><th>ESTADO</th><th>ACCIONES</th></tr></thead><tbody>${db.users.map(u=>`<tr><td><b>${esc(u.name)}</b><br><small class="muted">${esc(u.createdAt||'')}</small></td><td>${esc(u.phone)}</td><td>${esc(u.referralCode)}<br><small class="muted">${db.users.filter(x=>x.invitedBy===u.id).length} amigos</small></td><td>${cash(u.id===db.sessionUserId?db.eligibleSpend:u.eligibleSpend||0)}</td><td><b>${coinsForAccount(u)} RC</b></td><td>${statusBadge(u.active===false?'Rechazado':'Completado')}</td><td><div class="admin-action-row"><button class="filter-chip" onclick="adminAdjustCoins('${u.id}')">Ajustar RC</button><button class="filter-chip" onclick="adminToggleUser('${u.id}')">${u.active===false?'Activar':'Desactivar'}</button></div></td></tr>`).join('')}</tbody></table></div>`:empty('♙','Todavía no hay cuentas registradas en este navegador.')}</section><p class="security-note">Para que todos los usuarios vean sus cuentas desde cualquier teléfono o PC, hay que conectar Auth + base de datos remota. Esta tabla es solamente la demo local.</p>`}
function adminAdjustCoins(id){const u=db.users.find(x=>x.id===id);if(!u)return;const amount=Number(prompt('Cantidad de RefillCoins que se sumarán o restarán. Ejemplo: 5 o -3','5'));if(!Number.isInteger(amount)||!amount)return toast('Introduce un entero distinto de cero');const currentBalance=coinsForAccount(u);if(currentBalance+amount<0)return toast('El saldo no puede quedar negativo');if(id===db.sessionUserId){addCoinLedger(amount,'Ajuste administrativo','admin-adjust-'+Date.now())}else{u.coins=Math.max(0,Number(u.coins||0)+amount);u.coinLedger=u.coinLedger||[];u.coinLedger.unshift({id:'RC-'+Date.now(),date:new Date().toLocaleString('es-ES'),description:'Ajuste administrativo',amount,balanceAfter:u.coins})}persist();render();toast('Saldo de RefillCoins ajustado')}
function adminToggleUser(id){const u=db.users.find(x=>x.id===id);if(!u)return;u.active=u.active===false?true:false;persist();render();toast(u.active?'Cuenta activada':'Cuenta desactivada')}
function allOwnedOrders(){const out=[];for(const u of db.users){const arr=u.id===db.sessionUserId?db.orders:(u.orders||[]);for(const o of arr)out.push({order:o,user:u})}return out}
function allOwnedDeposits(){const out=[];for(const u of db.users){const arr=u.id===db.sessionUserId?db.deposits:(u.deposits||[]);for(const d of arr)out.push({deposit:d,user:u})}return out}
function findOrderOwner(orderId){for(const pair of allOwnedOrders())if(pair.order.id===orderId)return pair;return null}
function findDepositOwner(depositId){for(const pair of allOwnedDeposits())if(pair.deposit.id===depositId)return pair;return null}
function completeOrderRewards(user,order,isCurrent){const amount=Math.max(0,Number(order.amount)||0),before=isCurrent?Number(db.eligibleSpend||0):Number(user.eligibleSpend||0),after=Number((before+amount).toFixed(2));if(isCurrent)db.eligibleSpend=after;else user.eligibleSpend=after;const rate=Math.max(1,Math.floor(Number(db.loyalty.coinsPerUsd)||1)),earned=(Math.floor(after)*rate)-(Math.floor(before)*rate);if(earned>0)grantCoinsToUser(user.id,earned,'Compra completada: '+order.offerName,order.id);order.coinsAwarded=earned;const referralPaid=isCurrent?db.referralRewardPaid:Boolean(user.referralRewardPaid);if(user.invitedBy&&!referralPaid&&after>=Number(db.loyalty.referralMinSpend||0)){if(isCurrent)db.referralRewardPaid=true;else user.referralRewardPaid=true;grantCoinsToUser(user.id,Number(db.loyalty.referralFriendCoins)||0,'Recompensa por invitación: primera meta completada', 'referral-friend-'+user.id);grantCoinsToUser(user.invitedBy,Number(db.loyalty.referralInviterCoins)||0,'Tu amigo completó su meta de invitación','referral-inviter-'+user.id)}}
function methodName(id){return db.methods.find(m=>m.id===id)?.name||id}
function gameById(id){return db.games.find(g=>g.id===id)}
function offerById(id){return db.offers.find(o=>o.id===id)}
function activeOffers(gameId){return db.offers.filter(o=>o.active&&(!gameId||o.gameId===gameId)&&gameById(o.gameId)?.active)}
function productEquiv(price){return {cup:price*db.rates.cup,sm:price*db.rates.sm,usdt:price*db.rates.usdt}}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2800)}
function updateHeader(){const el=document.getElementById('topBalance');if(el)el.textContent=cash(db.balance)+' USD';const u=currentUser();const coins=document.getElementById('topCoins');if(coins)coins.textContent=Number(db.coins||0)+' RC';const name=document.getElementById('topName');if(name)name.textContent=u?u.name:'Entrar / Registrarse';const avatar=document.getElementById('topAvatar');if(avatar)avatar.textContent=u?(u.name.trim()[0]||'U').toUpperCase():'R';const brand=(db.settings.brand||'REFILLS SHOP').trim().split(/\s+/);document.querySelectorAll('.brand-name').forEach(n=>{n.innerHTML=brand.length>1?esc(brand.slice(0,-1).join(' '))+' <span>'+esc(brand[brand.length-1])+'</span>':esc(brand[0]||'REFILLS')});const accent=/^#[0-9a-fA-F]{6}$/.test(db.settings.accent||'')?db.settings.accent:'#2d8cff';document.documentElement.style.setProperty('--blue',accent);document.documentElement.style.setProperty('--brand-accent',accent);document.title=(db.settings.brand||'REFILLS SHOP')+' — Gaming top-ups'}
function navigate(route){if(route==='admin'){location.hash='admin';return}location.hash=route}
function routeParts(){let h=decodeURIComponent(location.hash.slice(1)||'inicio');return h.split('/').filter(Boolean)}
function syncNav(route){document.querySelectorAll('[data-route]').forEach(b=>b.classList.toggle('active',b.dataset.route===route||(route.startsWith('game')&&b.dataset.route==='juegos')))}
function safeImageURL(value){try{const u=new URL(String(value||''),location.href);return ['http:','https:'].includes(u.protocol)?u.href:''}catch(e){return ''}}
function gameImageURL(gameId){const g=gameById(gameId);return safeImageURL(g?.image)||safeImageURL(imageSources[gameId])}

function adminDashboard(){const orders=allOwnedOrders().map(x=>x.order),deposits=allOwnedDeposits().map(x=>x.deposit);const sales=orders.filter(o=>o.status==='Completado').reduce((s,o)=>s+o.amount,0),margin=orders.filter(o=>o.status==='Completado').reduce((s,o)=>s+(o.amount-(offerById(o.offerId)?.cost||0)),0),pending=deposits.filter(d=>d.status==='Pendiente').length;return `<div class="admin-stats"><div class="admin-stat"><small>VENTAS COMPLETADAS</small><strong>${cash(sales)}</strong><em>USD demo</em></div><div class="admin-stat"><small>MARGEN BRUTO ESTIMADO</small><strong>${cash(margin)}</strong><em>Según coste de ofertas</em></div><div class="admin-stat"><small>DEPÓSITOS PENDIENTES</small><strong>${pending}</strong><em>Solicitudes por revisar</em></div><div class="admin-stat"><small>CUENTAS / PEDIDOS</small><strong>${db.users.length} / ${orders.length}</strong><em>En este navegador</em></div></div><div class="admin-content-grid"><section class="panel"><h3>Accesos rápidos</h3><div class="filter-row"><button class="filter-chip" onclick="adminTab='offers';render()">＋ Editar ofertas</button><button class="filter-chip" onclick="adminTab='rates';render()">💱 Actualizar tasas</button><button class="filter-chip" onclick="adminTab='deposits';render()">⇧ Revisar depósitos</button><button class="filter-chip" onclick="adminTab='settings';render()">⚙ Ajustes web</button></div><p class="muted" style="font-size:11px">Las cifras reflejan únicamente datos guardados en este navegador.</p></section><section class="panel"><h3>Actividad reciente</h3>${[...db.orders.slice(0,3).map(o=>({type:'Pedido',title:o.gameName+' · '+o.offerName,date:o.date,status:o.status})),...db.deposits.slice(0,3).map(d=>({type:'Depósito',title:methodName(d.method)+' · '+cash(d.amount),date:d.date,status:d.status}))].slice(0,5).map(a=>`<div style="padding:10px 0;border-bottom:1px solid #ffffff0b;display:flex;justify-content:space-between;gap:12px"><div><b style="font-size:11px">${esc(a.title)}</b><small class="muted" style="display:block;font-size:9px">${esc(a.type)} · ${esc(a.date)}</small></div>${statusBadge(a.status)}</div>`).join('')||empty('◈','Todavía no hay actividad registrada.')}</section></div>`}
function adminOffers(){return `<div class="section-head"><div><h2>Ofertas y precios</h2><p>Controla nombre, juego, precio de venta, coste del proveedor, margen y visibilidad.</p></div><button class="btn btn-primary btn-small" onclick="editOffer()">＋ Nueva oferta</button></div><div class="admin-stats"><div class="admin-stat"><small>OFERTAS CREADAS</small><strong>${db.offers.length}</strong><em>Incluye pausadas</em></div><div class="admin-stat"><small>OFERTAS ACTIVAS</small><strong>${db.offers.filter(o=>o.active).length}</strong><em>Visibles en la tienda</em></div><div class="admin-stat"><small>MARGEN MEDIO</small><strong>${cash(db.offers.length?db.offers.reduce((n,o)=>n+o.price-o.cost,0)/db.offers.length:0)}</strong><em>Por producto, antes de gastos</em></div><div class="admin-stat"><small>MONEDA BASE</small><strong>USD</strong><em>Los equivalentes usan las tasas</em></div></div><section class="panel"><div class="table-scroll"><table class="list-table"><thead><tr><th>OFERTA</th><th>JUEGO</th><th>COSTE</th><th>VENTA</th><th>MARGEN</th><th>ESTADO</th><th>ACCIONES</th></tr></thead><tbody>${db.offers.map(o=>{const g=gameById(o.gameId)||{name:'—'};return `<tr><td><b>${esc(o.name)}</b><br><span class="muted">${esc(o.description||'')}</span>${o.featured?'<br><span class="status ok">Destacada</span>':''}</td><td>${esc(g.name)}</td><td>${cash(o.cost)}</td><td><b>${cash(o.price)}</b></td><td style="color:${o.price>=o.cost?'#58ddb4':'#ff8296'}">${cash(o.price-o.cost)}</td><td><span class="status ${o.active?'ok':'bad'}">${o.active?'Activa':'Pausada'}</span></td><td><div class="admin-action-row"><button class="filter-chip" onclick="editOffer('${o.id}')">Editar</button><button class="filter-chip" onclick="toggleOffer('${o.id}')">${o.active?'Pausar':'Activar'}</button><button class="filter-chip danger-chip" onclick="deleteOffer('${o.id}')">Eliminar</button></div></td></tr>`}).join('')}</tbody></table></div></section>`}
function adminGames(){return `<div class="section-head"><div><h2>Juegos y catálogo</h2><p>Edita la información pública, imágenes, color, categoría y disponibilidad de cada juego.</p></div><button class="btn btn-primary btn-small" onclick="editGame()">＋ Nuevo juego</button></div><div class="notice" style="margin-bottom:16px">El juego de portada se selecciona en <b>Configuración</b>. Free Fire permanece en el catálogo, pero no es el protagonista por defecto.</div><div class="game-grid">${db.games.map(g=>`<article class="game-card"><div class="game-cover" style="--game-a:${esc(g.color)}">${imageHTML(g.id)}<div class="cover-shade"></div><span class="game-icon">${esc(g.icon)}</span><span class="game-tag">${g.active?'ACTIVO':'PAUSADO'}</span></div><div class="game-info"><h3>${esc(g.name)}</h3><p>${esc(g.category)} · ${esc(g.description)}</p><div class="game-foot"><button onclick="editGame('${g.id}')">Editar</button><button onclick="toggleGame('${g.id}')">${g.active?'Pausar':'Activar'}</button><button onclick="deleteGame('${g.id}')">Eliminar</button></div></div></article>`).join('')}</div>`}
function adminRates(){return `<div class="section-head"><div><h2>Tasas de cambio</h2><p>Los precios base siguen en USD. Los equivalentes se calculan con estas tasas.</p></div></div><section class="panel"><form onsubmit="saveRates(event)"><div class="form-grid"><label class="field"><span>1 USD = CUP</span><input id="rateCUP" type="number" min="0.0001" step="0.01" value="${db.rates.cup}" required></label><label class="field"><span>1 USD = saldo móvil (SM)</span><input id="rateSM" type="number" min="0.0001" step="0.01" value="${db.rates.sm}" required></label><label class="field"><span>1 USD = USDT</span><input id="rateUSDT" type="number" min="0.0001" step="0.0001" value="${db.rates.usdt}" required></label><div class="field"><span>Vista previa · oferta de ${cash(activeOffers()[0]?.price||1)}</span><div class="notice">${num((activeOffers()[0]?.price||1)*db.rates.cup)} CUP · ${num((activeOffers()[0]?.price||1)*db.rates.sm)} SM · ${num((activeOffers()[0]?.price||1)*db.rates.usdt)} USDT</div></div></div><button class="btn btn-primary" type="submit">Guardar tasas</button></form></section><div class="notice" style="margin-top:14px">Las tasas son valores que define el administrador. No son cotizaciones automáticas ni valores recomendados. Actualízalas según tu operativa y deja claro qué tasa se aplica a cada método.</div>`}
function adminDeposits(){const items=allOwnedDeposits();return `<div class="section-head"><div><h2>Solicitudes de depósito</h2><p>Aprueba solo después de verificar el pago fuera de esta demo.</p></div></div><section class="panel">${items.length?`<div class="table-scroll"><table class="list-table"><thead><tr><th>USUARIO / FECHA / ID</th><th>MÉTODO</th><th>IMPORTE</th><th>REFERENCIA</th><th>ESTADO</th><th>ACCIÓN</th></tr></thead><tbody>${items.map(({deposit:d,user:u})=>`<tr><td>${esc(u.name)}<br><span class="muted">${esc(u.phone)} · ${esc(d.date)}<br>${esc(d.id)}</span></td><td>${esc(methodName(d.method))}<br><span class="muted">${num(d.localAmount)} ${esc(d.localUnit)}</span></td><td>${cash(d.amount)}</td><td>${esc(d.reference||'—')}</td><td>${statusBadge(d.status)}</td><td>${d.status==='Pendiente'?`<button class="filter-chip" onclick="decideDeposit('${d.id}','Aprobado')">Aprobar</button><button class="filter-chip" onclick="decideDeposit('${d.id}','Rechazado')">Rechazar</button>`:'—'}</td></tr>`).join('')}</tbody></table></div>`:empty('⇧','No hay depósitos pendientes ni anteriores.')}</section>`}
function adminOrders(){const items=allOwnedOrders();return `<div class="section-head"><div><h2>Gestión de pedidos</h2><p>Actualiza manualmente el estado de los pedidos en esta demo.</p></div><button class="btn btn-secondary btn-small" onclick="exportOrders()">Exportar CSV ↓</button></div><section class="panel">${items.length?`<div class="table-scroll"><table class="list-table"><thead><tr><th>USUARIO / FECHA / PEDIDO</th><th>PRODUCTO / JUEGO</th><th>ID JUGADOR</th><th>IMPORTE</th><th>ESTADO</th><th>CAMBIAR</th></tr></thead><tbody>${items.map(({order:o,user:u})=>`<tr><td>${esc(u.name)}<br><span class="muted">${esc(u.phone)} · ${esc(o.date)}<br>#${esc(o.id)}</span></td><td>${esc(o.offerName)}<br><span class="muted">${esc(o.gameName)}</span></td><td>${esc(o.playerId)}</td><td>${cash(o.amount)}</td><td>${statusBadge(o.status)}</td><td><select onchange="setOrderStatus('${o.id}',this.value)" style="background:#07162b;color:#fff;border:1px solid #28435f;padding:7px;border-radius:8px;font-size:10px"><option ${o.status==='Pendiente'?'selected':''}>Pendiente</option><option ${o.status==='Procesando'?'selected':''}>Procesando</option><option ${o.status==='Completado'?'selected':''}>Completado</option><option ${o.status==='Fallido'?'selected':''}>Fallido</option></select></td></tr>`).join('')}</tbody></table></div>`:empty('▤','No hay pedidos todavía.')}</section>`}
function adminMethods(){return `<div class="section-head"><div><h2>Métodos de pago</h2><p>Activa métodos, cambia el nombre, las instrucciones y la moneda que usa la tasa.</p></div><button class="btn btn-primary btn-small" onclick="addMethod()">＋ Nuevo método</button></div><div class="admin-content-grid">${db.methods.map(m=>{const unit=m.unit||(m.id==='sm'?'sm':m.id==='usdt'?'usdt':'cup');return `<section class="panel"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:15px"><h3 style="margin:0">${esc(m.name)}</h3><button class="filter-chip ${m.enabled?'active':''}" onclick="toggleMethod('${m.id}')">${m.enabled?'Activo':'Pausado'}</button></div><label class="field"><span>Nombre visible</span><input id="method-name-${m.id}" value="${esc(m.name)}"></label><label class="field"><span>Moneda para calcular el equivalente</span><select id="method-unit-${m.id}"><option value="cup" ${unit==='cup'?'selected':''}>CUP</option><option value="sm" ${unit==='sm'?'selected':''}>Saldo móvil (SM)</option><option value="usdt" ${unit==='usdt'?'selected':''}>USDT</option></select></label><label class="field"><span>Instrucciones para el cliente</span><textarea id="method-instr-${m.id}">${esc(m.instructions)}</textarea></label><button class="btn btn-secondary btn-small" onclick="saveMethod('${m.id}')">Guardar método</button></section>`}).join('')}</div>`}
function adminCoupons(){return `<div class="section-head"><div><h2>Cupones promocionales</h2><p>Los clientes pueden introducir un código al comprar un pack.</p></div><button class="btn btn-primary btn-small" onclick="editCoupon()">＋ Crear cupón</button></div><section class="panel">${db.coupons.length?`<div class="table-scroll"><table class="list-table"><thead><tr><th>CÓDIGO</th><th>DESCUENTO</th><th>ESTADO</th><th>ACCIÓN</th></tr></thead><tbody>${db.coupons.map(c=>`<tr><td><b>${esc(c.code)}</b></td><td>${Number(c.percent)}%</td><td>${statusBadge(c.active?'Completado':'Rechazado')}</td><td><button class="filter-chip" onclick="toggleCoupon('${esc(c.code)}')">${c.active?'Pausar':'Activar'}</button> <button class="filter-chip danger-chip" onclick="deleteCoupon('${esc(c.code)}')">Eliminar</button></td></tr>`).join('')}</tbody></table></div>`:empty('％','Todavía no has creado cupones.')}</section><p class="muted" style="font-size:10px;margin-top:12px">Los cupones son parte de la demo local; en producción deben validarse y aplicarse en el servidor para impedir manipulaciones.</p>`}
function adminSettings(){return `<div class="section-head"><div><h2>Configuración de la web</h2><p>Control general del aspecto, portada, soporte, identidad visual y mantenimiento.</p></div></div><section class="panel"><form onsubmit="saveSettings(event)"><div class="form-grid"><label class="field"><span>Nombre de la tienda</span><input id="setBrand" value="${esc(db.settings.brand)}" required></label><label class="field"><span>Color principal (hex)</span><input id="setAccent" value="${esc(db.settings.accent||'#2d8cff')}" pattern="^#[0-9a-fA-F]{6}$" placeholder="#2d8cff" required></label></div><label class="field"><span>Titular de la página principal</span><input id="setHeroTitle" value="${esc(db.settings.heroTitle)}" required></label><label class="field"><span>Descripción de portada</span><textarea id="setHeroSubtitle">${esc(db.settings.heroSubtitle)}</textarea></label><div class="form-grid"><label class="field"><span>Juego protagonista de la portada</span><select id="setHeroGame">${db.games.filter(g=>g.active).map(g=>`<option value="${g.id}" ${db.settings.heroGameId===g.id?'selected':''}>${esc(g.name)}</option>`).join('')}</select></label><label class="field"><span>URL de imagen personalizada para portada (opcional)</span><input id="setHeroImage" type="url" value="${esc(db.settings.heroImageUrl||'')}" placeholder="https://..."><small class="muted">Si queda vacía, se utiliza la imagen del juego elegido.</small></label></div><label class="field"><span>Anuncio superior</span><input id="setAnnouncement" value="${esc(db.settings.announcement)}"></label><label class="field"><span>WhatsApp de soporte (código de país + número, sin +)</span><input id="setWhatsApp" value="${esc(db.settings.whatsapp)}"></label><label class="field"><span><input type="checkbox" id="setMaintenance" ${db.settings.maintenance?'checked':''} style="width:auto;margin-right:7px"> Activar modo mantenimiento y ocultar la tienda a visitantes</span></label><div class="admin-form-actions"><button class="btn btn-primary" type="submit">Guardar configuración</button><button class="btn btn-secondary" type="button" onclick="resetDemo()">Restaurar datos de demo</button></div></form></section><section class="panel subsection"><h3>Datos locales y respaldo</h3><p class="muted" style="font-size:11px">${db.games.length} juegos · ${db.offers.length} ofertas · ${db.orders.length} pedidos · ${db.deposits.length} depósitos</p><div class="admin-form-actions"><button class="btn btn-secondary btn-small" onclick="exportData()">Exportar copia JSON ↓</button><button class="btn btn-secondary btn-small" onclick="exportOrders()">Exportar pedidos CSV ↓</button></div></section>`}
function adminLogin(e){e.preventDefault();const p=document.getElementById('adminPassword')?.value||'';if(p!==ADMIN_PASSWORD){toast('Contraseña incorrecta');return}adminAuthed=true;adminTab='dashboard';render();toast('Acceso de demostración autorizado')}
function adminLogout(){adminAuthed=false;location.hash='admin';render()}
function modal(content){document.getElementById('modalHost').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><section class="modal"><button class="modal-close" onclick="closeModal()" aria-label="Cerrar">×</button>${content}</section></div>`}
function closeModal(){document.getElementById('modalHost').innerHTML=''}
function openBuy(id){if(!requireAccount('Crea una cuenta o inicia sesión antes de comprar.'))return;const o=offerById(id),g=o&&gameById(o.gameId);if(!o||!g)return;modal(`<span class="eyebrow">CONFIRMAR RECARGA</span><h2>${esc(o.name)}</h2><p class="modal-sub">${esc(g.name)} · Precio base en USD</p><form onsubmit="confirmBuy(event,'${o.id}')"><label class="field"><span>ID de jugador / cuenta</span><input id="buyPlayerId" placeholder="Introduce tu ID de juego" required maxlength="80"></label><label class="field"><span>Servidor / región (si aplica)</span><input id="buyServer" placeholder="Ej. América / Global (opcional)" maxlength="80"></label><label class="field"><span>Cupón de descuento (opcional)</span><input id="buyCoupon" placeholder="Introduce tu código"></label><div class="notice" id="buyPricePreview">Precio: ${cash(o.price)} USD · ≈ ${num(o.price*db.rates.cup)} CUP</div><div class="modal-total"><span>Importe total</span><b id="buyTotal">${cash(o.price)}</b></div><p class="muted" style="font-size:11px">Wallet disponible: ${cash(db.balance)}. La compra genera un pedido de demostración; aún no conecta con el proveedor.</p><button class="btn btn-primary" type="submit">Confirmar pedido ↗</button></form>`);const c=document.getElementById('buyCoupon');c.addEventListener('input',()=>updateBuyPreview(o));updateBuyPreview(o)}
function couponFor(code){const uid=db.sessionUserId;return db.coupons.find(c=>c.active&&c.code.toUpperCase()===String(code||'').trim().toUpperCase()&&(!c.userId||c.userId===uid))}
function updateBuyPreview(o){const code=document.getElementById('buyCoupon')?.value||'',coupon=couponFor(code),discount=coupon?coupon.percent:0,total=o.price*(1-discount/100);document.getElementById('buyTotal').textContent=cash(total);document.getElementById('buyPricePreview').innerHTML=`Precio: ${cash(o.price)} USD${coupon?` · Cupón ${esc(coupon.code)}: -${discount}%`:' · '+num(o.price*db.rates.cup)+' CUP'}${!coupon&&code?'<br><span style="color:#ffc66d">Cupón no válido o inactivo</span>':''}`}
function confirmBuy(e,id){e.preventDefault();if(!requireAccount())return;const o=offerById(id);if(!o||!o.active)return toast('Esta oferta no está disponible');const g=gameById(o.gameId),pid=document.getElementById('buyPlayerId').value.trim(),server=document.getElementById('buyServer').value.trim(),code=document.getElementById('buyCoupon').value.trim(),coupon=code?couponFor(code):null;if(code&&!coupon)return toast('El cupón no es válido');const amount=Number((o.price*(1-(coupon?coupon.percent:0)/100)).toFixed(2));if(db.balance<amount){closeModal();toast('Saldo insuficiente. Recarga tu Wallet.');navigate('wallet');return}db.balance=Number((db.balance-amount).toFixed(2));const order={id:'RS-'+Date.now().toString().slice(-8),offerId:o.id,offerName:o.name,gameId:g.id,gameName:g.name,playerId:pid,server,amount,originalAmount:o.price,coupon:coupon?.code||'',status:'Pendiente',walletRefunded:false,date:new Date().toLocaleString('es-ES')};db.orders.unshift(order);db.ledger.unshift({ts:Date.now(),date:order.date,description:`Compra: ${g.name} / ${o.name}`,type:'Débito',amount:-amount,balanceAfter:db.balance});persist();closeModal();toast('Pedido creado · revisa el estado en Mis pedidos');navigate('pedidos')}
function openDeposit(){if(!requireAccount('Inicia sesión para recargar tu Wallet.'))return;const methods=db.methods.filter(m=>m.enabled);if(!methods.length)return toast('No hay métodos de depósito activos');modal(`<span class="eyebrow">AÑADIR SALDO</span><h2>Recargar Wallet</h2><p class="modal-sub">La solicitud queda pendiente hasta su revisión.</p><form onsubmit="submitDeposit(event)"><label class="field"><span>Importe que quieres añadir (USD)</span><input id="depositAmount" type="number" min="0.5" max="10000" step="0.01" value="5" required oninput="updateDepositPreview()"></label><label class="field"><span>Método de pago</span><select id="depositMethod" onchange="updateDepositPreview()">${methods.map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join('')}</select></label><div class="notice" id="depositPreview"></div><label class="field" style="margin-top:14px"><span>Referencia o nota (opcional)</span><input id="depositRef" maxlength="100" placeholder="Ej. referencia de transferencia"></label><div id="methodInstruction" class="notice" style="margin-bottom:15px"></div><button class="btn btn-primary" type="submit">Enviar solicitud ↗</button></form>`);updateDepositPreview()}
function localValue(amount,method){const m=db.methods.find(x=>x.id===method),unit=m?.unit||(method==='sm'?'sm':method==='usdt'?'usdt':'cup');if(unit==='sm')return {value:amount*db.rates.sm,unit:'SM'};if(unit==='usdt')return {value:amount*db.rates.usdt,unit:'USDT'};return {value:amount*db.rates.cup,unit:'CUP'}}
function updateDepositPreview(){const amount=Number(document.getElementById('depositAmount')?.value)||0,m=document.getElementById('depositMethod')?.value||'transfer',x=localValue(amount,m),meth=db.methods.find(z=>z.id===m);const p=document.getElementById('depositPreview'),ins=document.getElementById('methodInstruction');if(p)p.innerHTML=`<b>${cash(amount)} USD</b> equivale a <b>${num(x.value)} ${x.unit}</b> según la tasa configurada.`;if(ins)ins.innerHTML=`<b>${esc(meth?.name||'Método')}</b><br>${esc(meth?.instructions||'Consulta instrucciones con soporte.')}`}
function submitDeposit(e){e.preventDefault();if(!requireAccount())return;const amount=Number(document.getElementById('depositAmount').value),method=document.getElementById('depositMethod').value;if(!amount||amount<=0)return toast('Indica un importe válido');const x=localValue(amount,method),date=new Date().toLocaleString('es-ES'),d={id:'DEP-'+Date.now().toString().slice(-8),amount,method,localAmount:x.value,localUnit:x.unit,reference:document.getElementById('depositRef').value.trim(),status:'Pendiente',date,ts:Date.now()};db.deposits.unshift(d);persist();closeModal();toast('Solicitud enviada para revisión');render()}
function decideDeposit(id,status){const found=findDepositOwner(id);if(!found)return toast('Solicitud no encontrada');const {deposit:d,user:u}=found;if(d.status!=='Pendiente')return toast('La solicitud ya fue procesada');d.status=status;const amount=Number(d.amount)||0;if(status==='Aprobado'){if(u.id===db.sessionUserId){db.balance=Number((db.balance+amount).toFixed(2));db.ledger.unshift({ts:Date.now(),date:new Date().toLocaleString('es-ES'),description:'Depósito aprobado '+d.id,type:'Crédito',amount,balanceAfter:db.balance})}else{u.balance=Number(((u.balance||0)+amount).toFixed(2));u.ledger=u.ledger||[];u.ledger.unshift({ts:Date.now(),date:new Date().toLocaleString('es-ES'),description:'Depósito aprobado '+d.id,type:'Crédito',amount,balanceAfter:u.balance})}}persist();render();toast(status==='Aprobado'?'Depósito aprobado y saldo acreditado (demo)':'Depósito rechazado')}
function setOrderStatus(id,status){const found=findOrderOwner(id);if(!found)return toast('Pedido no encontrado');const {order:o,user:u}=found,was=o.status,isCurrent=u.id===db.sessionUserId;if(was==='Completado'&&status!=='Completado'){render();return toast('Un pedido completado no se puede reabrir desde este panel')}if(o.walletRefunded&&status==='Completado')return toast('Este pedido ya fue reembolsado y no se puede completar');o.status=status;if(status==='Fallido'&&was!=='Fallido'&&!o.walletRefunded){const amount=Number(o.amount)||0;if(isCurrent){db.balance=Number((db.balance+amount).toFixed(2));db.ledger.unshift({ts:Date.now(),date:new Date().toLocaleString('es-ES'),description:'Reembolso de pedido fallido '+o.id,type:'Crédito',amount,balanceAfter:db.balance})}else{u.balance=Number(((u.balance||0)+amount).toFixed(2));u.ledger=u.ledger||[];u.ledger.unshift({ts:Date.now(),date:new Date().toLocaleString('es-ES'),description:'Reembolso de pedido fallido '+o.id,type:'Crédito',amount,balanceAfter:u.balance})}o.walletRefunded=true}if(status==='Completado'&&was!=='Completado')completeOrderRewards(u,o,isCurrent);persist();render();toast(status==='Completado'&&was!=='Completado'?'Pedido completado y RefillCoins calculados':status==='Fallido'?'Pedido fallido · saldo reembolsado':'Estado del pedido actualizado')}
function saveRates(e){e.preventDefault();const cup=Number(document.getElementById('rateCUP').value),sm=Number(document.getElementById('rateSM').value),usdt=Number(document.getElementById('rateUSDT').value);if([cup,sm,usdt].some(v=>!Number.isFinite(v)||v<=0))return toast('Todas las tasas deben ser mayores que cero');db.rates={cup,sm,usdt};persist();render();toast('Tasas guardadas; las equivalencias se han actualizado')}
function editOffer(id){const o=id?offerById(id):null;modal(`<span class="eyebrow">CATÁLOGO</span><h2>${o?'Editar oferta':'Crear oferta'}</h2><p class="modal-sub">El precio de venta y el coste son valores de ejemplo hasta confirmar tarifas reales del proveedor.</p><form onsubmit="saveOffer(event,${o?`'${o.id}'`:'null'})"><label class="field"><span>Juego</span><select id="ofGame">${db.games.map(g=>`<option value="${g.id}" ${o?.gameId===g.id?'selected':''}>${esc(g.name)}</option>`).join('')}</select></label><label class="field"><span>Nombre de la oferta</span><input id="ofName" required value="${esc(o?.name||'')}"></label><label class="field"><span>Descripción breve</span><input id="ofDesc" value="${esc(o?.description||'')}" maxlength="120"></label><div class="form-grid"><label class="field"><span>Precio venta USD</span><input id="ofPrice" type="number" min="0.01" step="0.01" required value="${o?.price??1}"></label><label class="field"><span>Coste proveedor USD</span><input id="ofCost" type="number" min="0" step="0.01" required value="${o?.cost??.7}"></label></div><label class="field"><input id="ofFeatured" type="checkbox" ${o?.featured?'checked':''} style="width:auto;margin-right:7px"> Mostrar como oferta destacada</label><button class="btn btn-primary" type="submit">Guardar oferta</button></form>`)}
function saveOffer(e,id){e.preventDefault();const data={gameId:document.getElementById('ofGame').value,name:document.getElementById('ofName').value.trim(),description:document.getElementById('ofDesc').value.trim(),price:Number(document.getElementById('ofPrice').value),cost:Number(document.getElementById('ofCost').value),featured:document.getElementById('ofFeatured').checked,active:id?Boolean(offerById(id)?.active):true};if(!data.name||!Number.isFinite(data.price)||data.price<=0||!Number.isFinite(data.cost)||data.cost<0)return toast('Revisa el nombre y los importes');if(data.cost>data.price&&!confirm('El coste del proveedor supera al precio de venta. ¿Guardar de todas formas?'))return;if(id){Object.assign(offerById(id),data)}else{data.id='offer-'+Date.now();db.offers.push(data)}persist();closeModal();render();toast('Oferta y precios guardados')}
function toggleOffer(id){const o=offerById(id);if(!o)return;o.active=!o.active;persist();render();toast(o.active?'Oferta activada':'Oferta pausada')}
function editGame(id){const g=id?gameById(id):null;modal(`<span class="eyebrow">GESTIÓN DE JUEGO</span><h2>${g?'Editar '+esc(g.name):'Añadir juego'}</h2><form onsubmit="saveGame(event,${g?`'${g.id}'`:'null'})"><label class="field"><span>Nombre</span><input id="gName" value="${esc(g?.name||'')}" required></label><div class="form-grid"><label class="field"><span>Categoría</span><input id="gCategory" value="${esc(g?.category||'Shooter')}" required></label><label class="field"><span>Etiqueta</span><input id="gTag" value="${esc(g?.tag||'NUEVO')}" placeholder="EN TENDENCIA"></label></div><div class="form-grid"><label class="field"><span>Icono / emoji</span><input id="gIcon" value="${esc(g?.icon||'🎮')}" required maxlength="8"></label><label class="field"><span>Color de acento (hex)</span><input id="gColor" value="${esc(g?.color||'#2d8cff')}" pattern="^#[0-9a-fA-F]{6}$" required></label></div><label class="field"><span>Descripción</span><textarea id="gDesc" required>${esc(g?.description||'Recargas y contenido para este juego.')}</textarea></label><label class="field"><span>URL de imagen del juego (opcional)</span><input id="gImage" type="url" value="${esc(g?.image||'')}" placeholder="https://..."><small class="muted">Usa una imagen pública con permiso de reutilización; se mostrará en las tarjetas y en la página del juego.</small></label><button class="btn btn-primary" type="submit">${g?'Guardar cambios':'Crear juego'}</button></form>`)}
function saveGame(e,id){e.preventDefault();const name=document.getElementById('gName').value.trim(),category=document.getElementById('gCategory').value.trim(),tag=document.getElementById('gTag').value.trim(),description=document.getElementById('gDesc').value.trim(),icon=document.getElementById('gIcon').value.trim(),color=document.getElementById('gColor').value.trim(),rawImage=document.getElementById('gImage').value.trim(),image=rawImage?safeImageURL(rawImage):'';if(!name||!category||!description||!icon)return toast('Completa los campos obligatorios');if(rawImage&&!image)return toast('La URL de imagen debe empezar por http:// o https://');if(!/^#[0-9a-fA-F]{6}$/.test(color))return toast('El color debe tener formato hexadecimal, por ejemplo #2d8cff');let g=id?gameById(id):null;if(!g){let slug=name.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'game';if(db.games.some(x=>x.id===slug))slug+='-'+Date.now().toString().slice(-4);g={id:slug,active:true};db.games.push(g)}Object.assign(g,{name,category,tag,description,icon,color,image});persist();closeModal();render();toast(id?'Juego actualizado':'Juego añadido al catálogo')}
function deleteGame(id){const g=gameById(id);if(!g)return;const count=db.offers.filter(o=>o.gameId===id).length;if(!confirm(`¿Eliminar ${g.name}${count?` y sus ${count} ofertas`:''}? Esta acción no se puede deshacer en esta demo.`))return;db.games=db.games.filter(x=>x.id!==id);db.offers=db.offers.filter(o=>o.gameId!==id);if(db.settings.heroGameId===id)db.settings.heroGameId=db.games.find(x=>x.active&&x.id!=='free-fire')?.id||db.games.find(x=>x.active)?.id||'';persist();render();toast('Juego eliminado')}
function deleteOffer(id){const o=offerById(id);if(!o)return;if(!confirm(`¿Eliminar la oferta «${o.name}»? Los pedidos anteriores conservarán su registro.`))return;db.offers=db.offers.filter(x=>x.id!==id);persist();render();toast('Oferta eliminada')}
function toggleGame(id){const g=gameById(id);g.active=!g.active;persist();render();toast(g.active?'Juego visible':'Juego oculto en la tienda')}
function toggleMethod(id){const m=db.methods.find(x=>x.id===id);m.enabled=!m.enabled;persist();render();toast('Método actualizado')}
function saveMethod(id){const m=db.methods.find(x=>x.id===id);if(!m)return;m.name=document.getElementById('method-name-'+id).value.trim()||m.name;m.unit=document.getElementById('method-unit-'+id).value;m.instructions=document.getElementById('method-instr-'+id).value.trim();persist();render();toast('Método de pago guardado')}
function addMethod(){modal(`<span class="eyebrow">PAGOS Y DEPÓSITOS</span><h2>Añadir método de pago</h2><form onsubmit="saveNewMethod(event)"><label class="field"><span>Nombre visible</span><input id="newMethodName" required maxlength="48" placeholder="Ej. Transferencia adicional"></label><label class="field"><span>Moneda / tasa de equivalencia</span><select id="newMethodUnit"><option value="cup">CUP</option><option value="sm">Saldo móvil (SM)</option><option value="usdt">USDT</option></select></label><label class="field"><span>Instrucciones para el cliente</span><textarea id="newMethodInstructions" placeholder="Cómo completar el pago" required></textarea></label><button class="btn btn-primary" type="submit">Crear método</button></form>`)}
function saveNewMethod(e){e.preventDefault();const name=document.getElementById('newMethodName').value.trim(),unit=document.getElementById('newMethodUnit').value,instructions=document.getElementById('newMethodInstructions').value.trim();if(!name||!instructions)return toast('Completa el nombre y las instrucciones');let id=name.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'method';if(db.methods.some(m=>m.id===id))id+='-'+Date.now().toString().slice(-4);db.methods.push({id,name,unit,enabled:true,instructions});persist();closeModal();render();toast('Nuevo método creado')}
function editCoupon(){modal(`<span class="eyebrow">PROMOCIONES</span><h2>Nuevo cupón</h2><form onsubmit="saveCoupon(event)"><label class="field"><span>Código (sin espacios)</span><input id="couponCode" required maxlength="24" placeholder="EJEMPLO10"></label><label class="field"><span>Descuento (%)</span><input id="couponPercent" type="number" min="1" max="80" value="10" required></label><button class="btn btn-primary" type="submit">Crear cupón</button></form>`)}
function saveCoupon(e){e.preventDefault();const code=document.getElementById('couponCode').value.trim().toUpperCase().replace(/\s/g,''),percent=Number(document.getElementById('couponPercent').value);if(!code||percent<1||percent>80)return toast('Código o descuento inválido');if(db.coupons.some(c=>c.code===code))return toast('Ese código ya existe');db.coupons.push({code,percent,active:true});persist();closeModal();render();toast('Cupón creado')}
function toggleCoupon(code){const c=db.coupons.find(x=>x.code===code);if(c)c.active=!c.active;persist();render();toast(c?.active?'Cupón activado':'Cupón pausado')}
function deleteCoupon(code){const c=db.coupons.find(x=>x.code===code);if(!c)return;if(!confirm(`¿Eliminar el cupón ${code}?`))return;db.coupons=db.coupons.filter(x=>x.code!==code);persist();render();toast('Cupón eliminado')}
function saveSettings(e){e.preventDefault();const imageInput=document.getElementById('setHeroImage').value.trim(),accent=document.getElementById('setAccent').value.trim();if(imageInput&&!safeImageURL(imageInput))return toast('La imagen de portada debe usar una URL http:// o https://');if(!/^#[0-9a-fA-F]{6}$/.test(accent))return toast('El color principal debe ser hexadecimal, por ejemplo #2d8cff');db.settings.brand=document.getElementById('setBrand').value.trim();db.settings.heroTitle=document.getElementById('setHeroTitle').value.trim();db.settings.heroSubtitle=document.getElementById('setHeroSubtitle').value.trim();db.settings.heroGameId=document.getElementById('setHeroGame').value;db.settings.heroImageUrl=imageInput;db.settings.accent=accent;db.settings.announcement=document.getElementById('setAnnouncement').value.trim();db.settings.whatsapp=document.getElementById('setWhatsApp').value.replace(/\D/g,'');db.settings.maintenance=document.getElementById('setMaintenance').checked;persist();render();toast('Configuración general guardada') }
function exportOrders(){const rows=[['pedido','fecha','usuario','telefono','juego','oferta','id_jugador','servidor','importe_usd','estado'],...allOwnedOrders().map(({order:o,user:u})=>[o.id,o.date,u.name,u.phone,o.gameName,o.offerName,o.playerId,o.server,o.amount,o.status])];downloadFile('refills-pedidos.csv',rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n'),'text/csv;charset=utf-8');toast('Archivo CSV preparado')}
function exportData(){downloadFile('refills-shop-backup.json',JSON.stringify(db,null,2),'application/json');toast('Copia de datos preparada')}
function downloadFile(name,content,type){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();URL.revokeObjectURL(url)}
function resetDemo(){if(!confirm('¿Restaurar todos los datos de demostración? Se borrarán los cambios locales.'))return;db=structuredClone(seed);persist();render();toast('Demo restaurada')}
function showNotifications(){const pending=db.deposits.filter(d=>d.status==='Pendiente').length;toast(pending?`Tienes ${pending} depósito(s) pendiente(s) de revisión.`:'No tienes notificaciones nuevas.')}
function globalEvents(){document.querySelectorAll('[data-route]').forEach(b=>b.addEventListener('click',()=>navigate(b.dataset.route)));window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});window.addEventListener('keydown',e=>{if(e.altKey&&e.shiftKey&&e.key.toLowerCase()==='a'){e.preventDefault();navigate('admin')}if(e.key==='Escape')closeModal()});}
globalEvents();restoreSession();updateHeader();render();
window.navigate=navigate;window.render=render;window.copyText=copyText;window.createAccount=createAccount;window.loginAccount=loginAccount;window.logoutAccount=logoutAccount;window.copyReferralCode=copyReferralCode;window.copyReferralLink=copyReferralLink;window.spinRoulette=spinRoulette;window.redeemSpecialOffer=redeemSpecialOffer;window.saveLoyaltySettings=saveLoyaltySettings;window.editSpecialOffer=editSpecialOffer;window.saveSpecialOffer=saveSpecialOffer;window.toggleSpecialOffer=toggleSpecialOffer;window.deleteSpecialOffer=deleteSpecialOffer;window.adminAdjustCoins=adminAdjustCoins;window.adminToggleUser=adminToggleUser;Object.defineProperty(window,'gameFilter',{get:()=>gameFilter,set:v=>{gameFilter=v}});Object.defineProperty(window,'searchText',{get:()=>searchText,set:v=>{searchText=v}});Object.defineProperty(window,'adminTab',{get:()=>adminTab,set:v=>{adminTab=v}});window.adminLogin=adminLogin;window.adminLogout=adminLogout;window.openBuy=openBuy;window.confirmBuy=confirmBuy;window.openDeposit=openDeposit;window.submitDeposit=submitDeposit;window.updateDepositPreview=updateDepositPreview;window.closeModal=closeModal;window.decideDeposit=decideDeposit;window.setOrderStatus=setOrderStatus;window.saveRates=saveRates;window.editOffer=editOffer;window.saveOffer=saveOffer;window.toggleOffer=toggleOffer;window.deleteOffer=deleteOffer;window.toggleOffer=toggleOffer;window.editGame=editGame;window.saveGame=saveGame;window.toggleGame=toggleGame;window.deleteGame=deleteGame;window.toggleMethod=toggleMethod;window.saveMethod=saveMethod;window.addMethod=addMethod;window.saveNewMethod=saveNewMethod;window.editCoupon=editCoupon;window.saveCoupon=saveCoupon;window.toggleCoupon=toggleCoupon;window.deleteCoupon=deleteCoupon;window.saveSettings=saveSettings;window.exportOrders=exportOrders;window.exportData=exportData;window.resetDemo=resetDemo;window.showNotifications=showNotifications;Object.defineProperty(window,'offerGameFilter',{get:()=>offerGameFilter,set:v=>{offerGameFilter=v}});Object.defineProperty(window,'offerSearchText',{get:()=>offerSearchText,set:v=>{offerSearchText=v}});
})();
</script>
