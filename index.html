ación correcta de Supabase y Twilio.':'Modo demo: todavía no hay un proveedor configurado y no se enviará ningún mensaje real. Puedes probar el registro con el botón de demostración.'}</p>${!otpReady?`<button class="btn btn-secondary" style="width:100%;margin-top:8px" onclick="createDemoAccount()">Crear cuenta de demostración (sin WhatsApp)</button>`:''}</section><section class="account-form-card"><span class="eyebrow">YA TIENES CUENTA</span><h2>Iniciar sesión</h2><p>En este navegador puedes entrar con tu teléfono y PIN.</p><form onsubmit="loginAccount(event)"><label class="field"><span>Número de teléfono</span><input id="loginPhone" type="tel" inputmode="tel" autocomplete="tel" required placeholder="+53 5XXXXXXX"></label><label class="field"><span>PIN de acceso</span><input id="loginPin" type="password" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required placeholder="6 dígitos"></label><button class="btn btn-secondary" type="submit">Entrar a mi cuenta</button></form>${otpReady?`<div class="wa-otp-box"><h3>¿En otro teléfono?</h3><p class="muted">Puedes pedir un código de acceso para verificar tu número. La sincronización de Wallet y pedidos todavía necesita terminarse en el backend.</p><form onsubmit="requestLoginOtp(event)"><label class="field"><span>Número de WhatsApp</span><input id="loginWhatsappPhone" type="tel" required placeholder="+53 5XXXXXXX"></label><button class="btn btn-secondary" type="submit">Enviar código de acceso</button></form></div>`:''}<p class="security-note">Los datos del modo demo se guardan en este navegador. Para cuentas, saldos y pedidos compartidos entre dispositivos, hay que terminar la conexión con la base de datos.</p></section></div>`}
const invites=db.users.filter(x=>x.invitedBy===u.id);const wa=u.phoneVerified?'<span class="wa-status verified">✓ WhatsApp verificado</span>':'<span class="wa-status unverified">Modo demo · no verificado</span>';return `<div class="page-head-row"><div><span class="eyebrow">TU PERFIL</span><h1 class="page-title">Hola, ${esc(u.name)}.</h1><p class="page-desc">Tu cuenta y tus recompensas, en un solo lugar.</p>${wa}</div><button class="btn btn-secondary btn-small" onclick="logoutAccount()">Cerrar sesión ↗</button></div><div class="account-success"><section class="account-balance"><small>SALDO WALLET</small><strong>${cash(db.balance)} <span style="font-size:12px">USD</span></strong><p>${esc(u.phone)} · Cuenta creada ${esc(u.createdAt||'')}</p><div class="admin-form-actions"><button class="btn btn-primary btn-small" onclick="navigate('wallet')">Recargar Wallet</button><button class="btn btn-secondary btn-small" onclick="navigate('pedidos')">Ver pedidos</button></div></section><section class="account-card"><span class="eyebrow">INVITA A TUS AMIGOS</span><h2>Tu código personal</h2><p>Tu amigo se registra con este código. Cuando complete al menos ${cash(db.loyalty.referralMinSpend)} USD en compras completadas, ambos reciben la recompensa configurada.</p><div class="referral-code"><b>${esc(u.referralCode)}</b><button onclick="copyReferralCode()">Copiar código</button></div><button class="btn btn-secondary btn-small" onclick="copyReferralLink()">Copiar enlace de invitación ↗</button><div class="metrics" style="grid-template-columns:repeat(2,1fr);margin-top:15px"><div class="metric"><span class="metric-icon">👥</span><div><span class="metric-label">AMIGOS INVITADOS</span><strong>${invites.length}</strong></div></div><div class="metric"><span class="metric-icon">💠</span><div><span class="metric-label">REFILLCOINS</span><strong>${db.coins}</strong></div></div></div></section></div><section class="panel subsection"><h3>Notificaciones por WhatsApp</h3><p class="muted">Elige si deseas recibir avisos importantes de REFILLS SHOP en el chat asociado a tu número. Este ajuste no controla los códigos de acceso.</p><form onsubmit="saveWhatsappNotifications(event)"><label class="wa-consent"><input id="accountWhatsappNotifications" type="checkbox" ${u.whatsappNotifications?'checked':''}><span><b>${u.whatsappNotifications?'Tienes activados los avisos':'Activar avisos de WhatsApp'}</b><br>Cambios de tasas, mantenimiento y actualizaciones importantes del servicio. Podrás cambiar esta preferencia en cualquier momento.</span></label><button class="btn btn-primary btn-small" type="submit">Guardar preferencia</button></form><p class="security-note">La preferencia se guarda en esta demo. Para que los avisos se envíen de verdad se necesita configurar WhatsApp Business/Twilio y un proceso de notificaciones en el backend.</p></section><section class="panel subsection"><h3>Datos de cuenta</h3><div class="coin-ledger-row"><span>Nombre</span><b>${esc(u.name)}</b></div><div class="coin-ledger-row"><span>Teléfono</span><b>${esc(u.phone)}</b></div><div class="coin-ledger-row"><span>Verificación</span><b>${u.phoneVerified?'WhatsApp verificado':'No verificado (demo)'}</b></div><div class="coin-ledger-row"><span>Avisos por WhatsApp</span><b>${u.whatsappNotifications?'Aceptados':'Desactivados'}</b></div><div class="coin-ledger-row"><span>Compras completadas acumuladas</span><b>${cash(db.eligibleSpend)}</b></div><div class="coin-ledger-row"><span>Código usado al registrarte</span><b>${u.invitedBy?esc(db.users.find(x=>x.id===u.invitedBy)?.referralCode||'Invitación registrada'):'Sin invitación'}</b></div><button class="btn btn-secondary btn-small" style="margin-top:12px" onclick="navigate('refillcoins')">Gestionar mis RefillCoins ↗</button></section>`}
function getRegistrationDraft(){const name=document.getElementById('regName')?.value.trim()||'',phoneRaw=document.getElementById('regPhone')?.value.trim()||'',phoneE164=canonicalPhone(phoneRaw),pin=document.getElementById('regPin')?.value.trim()||'',ref=document.getElementById('regReferral')?.value.trim().toUpperCase()||'',whatsappNotifications=Boolean(document.getElementById('regWhatsappNotifications')?.checked);if(name.length<2){toast('Escribe un nombre de al menos 2 caracteres');return null}if(!/^\+[1-9][0-9]{7,14}$/.test(phoneE164)){toast('Revisa el número e incluye el prefijo del país, por ejemplo +53');return null}if(db.users.some(x=>normalizePhone(x.phone)===normalizePhone(phoneE164))){toast('Ya existe una cuenta con ese número en este navegador. Inicia sesión.');return null}if(!/^\d{6}$/.test(pin)){toast('El PIN debe tener 6 dígitos');return null}let inviter=null;if(ref){inviter=db.users.find(x=>String(x.referralCode||'').toUpperCase()===ref&&x.active!==false);if(!inviter&&!supabaseClient){toast('El código de invitación no existe en esta demo');return null}}return {name,phoneRaw,phoneE164,pin,ref,whatsappNotifications,inviter}}
async function requestRegistrationOtp(e){e.preventDefault();const draft=getRegistrationDraft();if(!draft)return;pendingRegistration=draft;if(!supabaseClient){modal(`<span class="eyebrow">VERIFICACIÓN POR WHATSAPP</span><h2>WhatsApp todavía no está conectado</h2><p class="modal-sub">No se ha enviado ningún código. Para activar el envío real tienes que configurar Supabase y un proveedor compatible de WhatsApp (Twilio/Twilio Verify), y aplicar la migración SQL V6.</p><div class="notice">En modo demostración puedes continuar sin verificación. La cuenta se marcará explícitamente como <b>no verificada</b>.</div><button class="btn btn-primary" style="width:100%;margin-top:14px" onclick="createDemoAccountFromDraft()">Continuar en modo demo</button><button class="btn btn-secondary" style="width:100%;margin-top:8px" onclick="closeModal()">Volver</button>`);return}const {error}=await supabaseClient.auth.signInWithOtp({phone:draft.phoneE164,options:{channel:'whatsapp',shouldCreateUser:true,data:{full_name:draft.name,whatsapp_notifications:draft.whatsappNotifications,invite_code:draft.ref||''}}});if(error){toast('No se pudo enviar el código: '+(error.message||'revisa la configuración de WhatsApp'));return}showRegistrationOtpModal(false);toast('Solicitud enviada al proveedor de WhatsApp')}
function createAccount(e){return requestRegistrationOtp(e)}
function showRegistrationOtpModal(isLogin){const phone=isLogin?pendingLoginPhone:pendingRegistration?.phoneE164;if(!phone)return;modal(`<span class="eyebrow">CÓDIGO DE VERIFICACIÓN</span><h2>Revisa tu WhatsApp</h2><p class="modal-sub">Hemos solicitado un código para <b>${esc(phone)}</b>. Introduce los seis dígitos recibidos. El código no es tu PIN de acceso.</p><form onsubmit="${isLogin?'verifyLoginOtp(event)':'verifyRegistrationOtp(event)'}"><label class="field"><span>Código de 6 dígitos</span><input id="whatsappOtpCode" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" minlength="6" maxlength="6" required placeholder="123456"></label><button class="btn btn-primary" type="submit">Verificar código</button></form><button class="btn btn-secondary" style="width:100%;margin-top:9px" onclick="resendWhatsappOtp(${isLogin?'true':'false'})">Solicitar otro código</button><p class="security-note">No compartas este código con nadie. Supabase/Twilio puede aplicar límites de frecuencia y caducidad.</p>`)}
async function verifyRegistrationOtp(e){e.preventDefault();if(!supabaseClient||!pendingRegistration)return toast('La verificación no está configurada');const token=document.getElementById('whatsappOtpCode')?.value.trim()||'';if(!/^\d{6}$/.test(token))return toast('Introduce el código de seis dígitos');const {data,error}=await supabaseClient.auth.verifyOtp({phone:pendingRegistration.phoneE164,token,type:'sms'});if(error){toast('Código inválido o caducado: '+(error.message||''));return}const authUser=data?.user;if(!authUser)return toast('No se pudo confirmar el usuario');pendingRegistration.pinHash=await userPinDigest(pendingRegistration.pin);await finishRegistration(pendingRegistration,true,authUser);pendingRegistration=null;closeModal()}
async function finishRegistration(draft,phoneVerified,authUser=null){let remoteProfile=null,remoteWallet=null;if(phoneVerified&&supabaseClient&&authUser){const profileResult=await supabaseClient.from('profiles').select('user_id,full_name,phone_e164,referral_code,referred_by,is_active,whatsapp_notifications,phone_verified_at').eq('user_id',authUser.id).maybeSingle();if(profileResult.error||!profileResult.data){toast('El código fue verificado, pero falta aplicar la migración SQL V6 o revisar las políticas de Supabase. No se creó una cuenta local duplicada.');return false}remoteProfile=profileResult.data;const walletResult=await supabaseClient.from('wallets').select('balance_usd,refillcoins_balance,eligible_completed_spend').eq('user_id',authUser.id).maybeSingle();if(!walletResult.error)remoteWallet=walletResult.data}
const referralLocal=draft.inviter?.id||db.users.find(x=>String(x.referralCode||'').toUpperCase()===draft.ref)?.id||remoteProfile?.referred_by||null;const u={id:authUser?.id||'USR-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,5),authUserId:authUser?.id||null,name:remoteProfile?.full_name||draft.name,phone:remoteProfile?.phone_e164||draft.phoneE164,phoneDigits:normalizePhone(remoteProfile?.phone_e164||draft.phoneE164),phoneE164:remoteProfile?.phone_e164||draft.phoneE164,phoneVerified:Boolean(phoneVerified),whatsappNotifications:typeof remoteProfile?.whatsapp_notifications==='boolean'?remoteProfile.whatsapp_notifications:draft.whatsappNotifications,verifiedAt:remoteProfile?.phone_verified_at||(phoneVerified?new Date().toISOString():null),referralCode:remoteProfile?.referral_code||newReferralCode(),invitedBy:referralLocal,createdAt:new Date().toLocaleDateString('es-ES'),active:remoteProfile?.is_active!==false,balance:Number(remoteWallet?.balance_usd||0),orders:[],deposits:[],ledger:[],coins:Number(remoteWallet?.refillcoins_balance||0),coinLedger:[],eligibleSpend:Number(remoteWallet?.eligible_completed_spend||0),referralRewardPaid:false,rouletteHistory:[],pinHash:draft.pinHash||''};const existing=db.users.find(x=>normalizePhone(x.phone)===normalizePhone(u.phone));if(existing){toast('Este número ya está guardado en este navegador. Inicia sesión con tu cuenta existente.');return false}db.users.push(u);activateAccount(u);persist();render();toast(phoneVerified?'Teléfono verificado por WhatsApp. Cuenta creada.':'Cuenta de demostración creada sin verificar el teléfono.');return true}
function createDemoAccount(){const draft=getRegistrationDraft();if(!draft)return;pendingRegistration=draft;modal(`<span class="eyebrow">MODO DEMOSTRACIÓN</span><h2>Crear cuenta de prueba</h2><p class="modal-sub">No se enviará un código de WhatsApp. El teléfono quedará como <b>no verificado</b> y los datos permanecerán en este navegador.</p><button class="btn btn-primary" style="width:100%" onclick="createDemoAccountFromDraft()">Crear cuenta de prueba</button><button class="btn btn-secondary" style="width:100%;margin-top:8px" onclick="closeModal()">Cancelar</button>`)}
async function createDemoAccountFromDraft(){if(!pendingRegistration)return;const draft=pendingRegistration;pendingRegistration=null;closeModal();await userPinDigest(draft.pin).then(async pinHash=>{draft.pinHash=pinHash;await finishRegistration(draft,false,null);const u=currentUser();if(u&&!u.pinHash){u.pinHash=pinHash;persist()}}).catch(()=>toast('No se pudo crear la cuenta de demostración'))}
async function resendWhatsappOtp(isLogin){if(!supabaseClient)return toast('WhatsApp no está configurado');const phone=isLogin?pendingLoginPhone:pendingRegistration?.phoneE164;if(!phone)return toast('No hay una solicitud de código activa');const options={channel:'whatsapp',shouldCreateUser:!isLogin};const result=await supabaseClient.auth.signInWithOtp({phone,options});if(result.error)toast('No se pudo reenviar: '+result.error.message);else toast('Se solicitó un nuevo código. Respeta los límites del proveedor.')}
async function requestLoginOtp(e){e.preventDefault();if(!supabaseClient)return toast('Primero configura Supabase y el proveedor de WhatsApp');const phone=canonicalPhone(document.getElementById('loginWhatsappPhone')?.value||'');if(!/^\+[1-9][0-9]{7,14}$/.test(phone))return toast('Introduce el número con prefijo internacional');pendingLoginPhone=phone;const {error}=await supabaseClient.auth.signInWithOtp({phone,options:{channel:'whatsapp',shouldCreateUser:false}});if(error){toast('No se pudo enviar el código: '+error.message);return}showRegistrationOtpModal(true);toast('Código de acceso solicitado')}
async function verifyLoginOtp(e){e.preventDefault();if(!supabaseClient||!pendingLoginPhone)return toast('No hay una solicitud de acceso activa');const token=document.getElementById('whatsappOtpCode')?.value.trim()||'';const {data,error}=await supabaseClient.auth.verifyOtp({phone:pendingLoginPhone,token,type:'sms'});if(error){toast('Código inválido o caducado: '+error.message);return}const authUser=data?.user;if(!authUser)return toast('No se pudo validar la sesión');const profileResult=await supabaseClient.from('profiles').select('user_id,full_name,phone_e164,referral_code,referred_by,is_active,whatsapp_notifications,phone_verified_at').eq('user_id',authUser.id).maybeSingle();if(profileResult.error||!profileResult.data){toast('No se encontró el perfil remoto. Aplica la migración V6 y revisa Supabase.');return}const pr=profileResult.data;const wr=await supabaseClient.from('wallets').select('balance_usd,refillcoins_balance,eligible_completed_spend').eq('user_id',authUser.id).maybeSingle();const wallet=wr.data||{};const ord=await supabaseClient.from('orders').select('id,game_id,game_name,offer_id,offer_name,player_id,server_id,amount_usd,status,created_at,completed_at').eq('user_id',authUser.id).order('created_at',{ascending:false}).limit(100);const statusMap={pending:'Pendiente',processing:'Procesando',completed:'Completado',failed:'Fallido',refunded:'Fallido'};const mappedOrders=(ord.data||[]).map(o=>({id:o.id,offerId:o.offer_id,offerName:o.offer_name,gameId:o.game_id,gameName:o.game_name,playerId:o.player_id,server:o.server_id||'',amount:Number(o.amount_usd),status:statusMap[o.status]||'Pendiente',date:o.created_at?new Date(o.created_at).toLocaleString('es-ES'):'',walletRefunded:o.status==='refunded'}));const tx=await supabaseClient.from('wallet_transactions').select('id,transaction_type,amount_usd,status,description,created_at').eq('user_id',authUser.id).order('created_at',{ascending:false}).limit(100);const deposits=(tx.data||[]).filter(t=>t.transaction_type==='deposit_request').map(t=>({id:t.id,amount:Number(t.amount_usd),method:'unknown',status:t.status==='approved'?'Aprobado':t.status==='rejected'?'Rechazado':'Pendiente',date:new Date(t.created_at).toLocaleString('es-ES')}));const ledger=(tx.data||[]).map(t=>({ts:new Date(t.created_at).getTime(),date:new Date(t.created_at).toLocaleString('es-ES'),description:t.description||t.transaction_type,type:t.amount_usd<0?'Débito':'Crédito',amount:Number(t.amount_usd),balanceAfter:null}));const cr=await supabaseClient.from('refillcoin_transactions').select('id,delta,reason,description,created_at').eq('user_id',authUser.id).order('created_at',{ascending:false}).limit(100);const coinLedger=(cr.data||[]).map(c=>({id:c.id,date:new Date(c.created_at).toLocaleString('es-ES'),description:c.description||c.reason,amount:Number(c.delta),balanceAfter:null}));let inviter=db.users.find(x=>x.authUserId===pr.referred_by||x.id===pr.referred_by);const u={id:authUser.id,authUserId:authUser.id,name:pr.full_name,phone:pr.phone_e164,phoneDigits:normalizePhone(pr.phone_e164),phoneE164:pr.phone_e164,phoneVerified:Boolean(pr.phone_verified_at),verifiedAt:pr.phone_verified_at,whatsappNotifications:Boolean(pr.whatsapp_notifications),referralCode:pr.referral_code,invitedBy:inviter?.id||pr.referred_by||null,createdAt:'Cuenta remota',active:pr.is_active!==false,balance:Number(wallet.balance_usd||0),orders:mappedOrders,deposits,ledger,coins:Number(wallet.refillcoins_balance||0),coinLedger,eligibleSpend:Number(wallet.eligible_completed_spend||0),referralRewardPaid:false,rouletteHistory:[],pinHash:''};const existing=db.users.find(x=>x.authUserId===authUser.id||normalizePhone(x.phone)===normalizePhone(pr.phone_e164));if(existing)db.users=db.users.filter(x=>x!==existing);db.users.push(u);activateAccount(u);persist();pendingLoginPhone='';closeModal();render();toast('Sesión verificada. Se cargó el perfil remoto; las operaciones de Wallet aún requieren el backend de producción.')}

function loginAccount(e){e.preventDefault();const phone=normalizePhone(document.getElementById('loginPhone').value),pin=document.getElementById('loginPin').value.trim();const u=db.users.find(x=>normalizePhone(x.phone)===phone);if(!u||u.active===false)return toast('Cuenta no encontrada o desactivada');userPinDigest(pin).then(hash=>{if(hash!==u.pinHash)return toast('Número o PIN incorrectos');activateAccount(u);persist();render();toast('Sesión iniciada')}).catch(()=>toast('No se pudo iniciar sesión'))}
function logoutAccount(){persist();db.sessionUserId=null;db.profile={id:'guest',name:'Invitado',phone:''};db.balance=0;db.orders=[];db.deposits=[];db.ledger=[];db.coins=0;db.coinLedger=[];db.eligibleSpend=0;db.referralRewardPaid=false;db.rouletteHistory=[];persist();render();toast('Sesión cerrada')}
async function saveWhatsappNotifications(e){e.preventDefault();const u=currentUser();if(!u)return toast('Inicia sesión');const enabled=Boolean(document.getElementById('accountWhatsappNotifications')?.checked);u.whatsappNotifications=enabled;persist();if(supabaseClient&&u.authUserId){const {error}=await supabaseClient.from('profiles').update({whatsapp_notifications:enabled,whatsapp_notifications_updated_at:new Date().toISOString()}).eq('user_id',u.authUserId);if(error){toast('Preferencia guardada localmente; no se pudo sincronizar con Supabase: '+error.message);return}}render();toast(enabled?'Avisos de WhatsApp activados':'Avisos de WhatsApp desactivados')}

function copyText(text){if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(()=>toast('Copiado al portapapeles')).catch(()=>fallbackCopy(text))}else fallbackCopy(text)}
function fallbackCopy(text){const t=document.createElement('textarea');t.value=text;document.body.appendChild(t);t.select();try{document.execCommand('copy');toast('Copiado al portapapeles')}catch(e){toast(text)}t.remove()}
function copyReferralCode(){const u=currentUser();if(u)copyText(u.referralCode)}
function copyReferralLink(){const u=currentUser();if(!u)return;const base=location.href.split('#')[0].split('?')[0];copyText(base+'?ref='+encodeURIComponent(u.referralCode)+'#cuenta')}
function coinsForAccount(u){return u&&u.id===db.sessionUserId?Number(db.coins||0):Number(u?.coins||0)}
function userSpendForAccount(u){return u&&u.id===db.sessionUserId?Number(db.eligibleSpend||0):Number(u?.eligibleSpend||0)}
function userCoinsLedger(u){return u&&u.id===db.sessionUserId?(db.coinLedger||[]):(u?.coinLedger||[])}
function refillcoinsView(){const u=currentUser();if(!u)return accountGate('RefillCoins');const invites=db.users.filter(x=>x.invitedBy===u.id);const led=userCoinsLedger(u).slice(0,8);return `<section class="rewards-hero"><div><span class="eyebrow">PROGRAMA DE RECOMPENSAS</span><h1>Compra. Gana.<br><span style="color:#8bd5ff">Vuelve a jugar.</span></h1><p>Por cada dólar acumulado en compras completadas ganas ${Number(db.loyalty.coinsPerUsd)} RefillCoin(s). Los depósitos no generan monedas y los pedidos pendientes no cuentan.</p><div class="hero-buttons"><button class="btn btn-primary" onclick="navigate('ruleta')">🎡 Ir a la ruleta</button><button class="btn btn-secondary" onclick="navigate('especiales')">🎁 Ofertas especiales</button></div></div><div class="coin-big"><div><span>TU SALDO</span><strong>${db.coins}</strong><span>REFILLCOINS</span></div><div style="font-size:34px">💠</div></div></section><div class="loyalty-grid"><article class="loyalty-item"><span class="loyalty-icon">🛒</span><h3>Gana comprando</h3><p>Las monedas se acreditan cuando el pedido se marca como completado. Se acumula el gasto para contar cada dólar entero.</p><button class="btn btn-secondary btn-small" onclick="navigate('ofertas')">Ver ofertas</button></article><article class="loyalty-item"><span class="loyalty-icon">🎡</span><h3>Ruleta de premios</h3><p>Utiliza ${db.loyalty.rouletteCost} RefillCoins por giro y descubre si ganas monedas extra o un cupón.</p><button class="btn btn-secondary btn-small" onclick="navigate('ruleta')">Probar suerte</button></article><article class="loyalty-item"><span class="loyalty-icon">👥</span><h3>Invita a tus amigos</h3><p>Tu código da ${db.loyalty.referralInviterCoins} monedas al invitador y ${db.loyalty.referralFriendCoins} al amigo cuando alcance el gasto mínimo.</p><button class="btn btn-secondary btn-small" onclick="navigate('cuenta')">Mi código</button></article></div><section class="panel subsection"><h3>Últimos movimientos de RefillCoins</h3>${led.length?led.map(x=>`<div class="coin-ledger-row"><span>${esc(x.description)}<small>${esc(x.date||'')}</small></span><b style="color:${x.amount>=0?'#58ddb4':'#ff8296'}">${x.amount>0?'+':''}${x.amount} RC</b></div>`).join(''):empty('💠','Tus monedas y premios aparecerán aquí.')}</section><div class="notice" style="margin-top:14px">${cash(userSpendForAccount(u))} en compras completadas acumuladas · ${Math.floor(userSpendForAccount(u))} USD enteros contabilizados.</div>`}
function rouletteView(){if(!currentUser())return accountGate('Ruleta de premios');const u=currentUser(),cost=Number(db.loyalty.rouletteCost)||10;const history=(db.rouletteHistory||[]).slice(0,5);return `<span class="eyebrow">REFILLS ARCADE</span><h1 class="page-title">Ruleta de premios</h1><p class="page-desc">Gasta RefillCoins acumulados y consigue monedas extra o cupones para tus recargas.</p><div class="wheel-wrap"><div><div id="rouletteWheel" class="wheel"></div><button class="btn btn-primary" style="width:100%;margin-top:25px" onclick="spinRoulette()">🎡 Girar · ${cost} RC</button><p class="muted" style="font-size:10px;text-align:center">Tu saldo: ${db.coins} RefillCoins</p></div><section class="reward-card"><span class="eyebrow">PREMIOS POSIBLES</span><h2>¿Qué puedes conseguir?</h2><p>Cada giro cuesta RefillCoins ganados por actividad; no acepta dinero ni añade monedas compradas.</p><div class="roulette-prizes"><div class="roulette-prize">🌫️ <span><b>Sin premio</b> · el giro cuesta el saldo indicado</span></div><div class="roulette-prize">💠 <span><b>+3 RefillCoins</b> · suma monedas a tu cuenta</span></div><div class="roulette-prize">💠 <span><b>+5 RefillCoins</b> · premio frecuente</span></div><div class="roulette-prize">🎟️ <span><b>Cupón 5%</b> · descuento personal</span></div><div class="roulette-prize">💎 <span><b>+15 RefillCoins</b> · premio especial</span></div></div>${history.length?`<section class="panel subsection"><h3>Últimos giros</h3>${history.map(h=>`<div class="coin-ledger-row"><span>${esc(h.prize)}<small>${esc(h.date)}</small></span><b>${h.cost} RC</b></div>`).join('')}</section>`:''}</section></div>`}
function spinRoulette(){if(!requireAccount())return;if(db.rouletteSpinning)return;const cost=Math.max(1,Number(db.loyalty.rouletteCost)||10);if(db.coins<cost)return toast('No tienes suficientes RefillCoins');db.rouletteSpinning=true;addCoinLedger(-cost,'Giro de ruleta', 'roulette-'+Date.now());persist();const wheel=document.getElementById('rouletteWheel');if(wheel)wheel.classList.add('spinning');const candidates=[{label:'Sin premio',type:'none',value:0,weight:35},{label:'+3 RefillCoins',type:'coins',value:3,weight:25},{label:'+5 RefillCoins',type:'coins',value:5,weight:20},{label:'Cupón personal del 5%',type:'coupon',value:5,weight:15},{label:'+15 RefillCoins',type:'coins',value:15,weight:5}];const roll=Math.random()*candidates.reduce((n,x)=>n+x.weight,0);let acc=0,prize=candidates[0];for(const p of candidates){acc+=p.weight;if(roll<acc){prize=p;break}}setTimeout(()=>{db.rouletteSpinning=false;if(prize.type==='coins')addCoinLedger(prize.value,'Premio de ruleta: '+prize.label,'roulette-reward-'+Date.now());if(prize.type==='coupon'){const code=createPersonalCoupon(prize.value,'RU');prize.label+=' · '+code;}const h={prize:prize.label,cost,date:new Date().toLocaleString('es-ES')};db.rouletteHistory.unshift(h);persist();render();toast('Resultado de la ruleta: '+prize.label)},1450)}
function addCoinLedger(amount,description,reference=''){const row={id:'RC-'+Date.now().toString(36),ts:Date.now(),date:new Date().toLocaleString('es-ES'),description,amount:Number(amount),balanceAfter:Number(db.coins||0)+Number(amount),reference};db.coins=Number((Number(db.coins||0)+Number(amount)).toFixed(0));row.balanceAfter=db.coins;db.coinLedger=db.coinLedger||[];db.coinLedger.unshift(row);}
function grantCoinsToUser(userId,amount,description,reference=''){amount=Math.floor(Number(amount)||0);if(amount<=0)return;const u=db.users.find(x=>x.id===userId);if(!u)return;if(userId===db.sessionUserId){addCoinLedger(amount,description,reference);return}u.coins=Number(u.coins||0)+amount;u.coinLedger=u.coinLedger||[];u.coinLedger.unshift({id:'RC-'+Date.now().toString(36),ts:Date.now(),date:new Date().toLocaleString('es-ES'),description,amount,balanceAfter:u.coins,reference})}
function createPersonalCoupon(percent,prefix='RC'){const u=currentUser();if(!u)return '';const code=prefix+'-'+u.referralCode.slice(-4)+'-'+Math.random().toString(36).slice(2,6).toUpperCase();db.coupons.push({code,percent:Number(percent),active:true,userId:u.id});return code}
function specialOffersView(){if(!currentUser())return accountGate('Ofertas especiales');const list=(db.specialOffers||[]).filter(o=>o.active);return `<span class="eyebrow">TIENDA DE RECOMPENSAS</span><h1 class="page-title">Ofertas especiales</h1><p class="page-desc">Canjea tus RefillCoins por saldo de Wallet o cupones personales. Estos premios no se compran con dinero.</p><div class="rewards-hero" style="margin-top:22px"><div><span class="eyebrow">TU SALDO DE CANJEO</span><h1>${db.coins} <span style="color:#9bdcff">RefillCoins</span></h1><p>Escoge un premio y confirma el canje. Los RefillCoins se descuentan de inmediato en esta demo.</p></div><div class="hero-buttons"><button class="btn btn-primary" onclick="navigate('refillcoins')">Ver recompensas</button></div></div><section class="panel subsection"><h3>Tus cupones personales</h3>${db.coupons.filter(c=>c.userId===u.id&&c.active).length?db.coupons.filter(c=>c.userId===u.id&&c.active).map(c=>`<div class="coin-ledger-row"><span><b>${esc(c.code)}</b><small>${Number(c.percent)}% de descuento · solo para esta cuenta</small></span><button class="filter-chip" onclick="copyText('${esc(c.code)}')">Copiar</button></div>`).join(''):empty('🎟️','Los cupones que ganes o canjees aparecerán aquí.')}</section><div class="loyalty-grid">${list.map(o=>`<article class="loyalty-item"><span class="loyalty-icon">${o.type==='wallet'?'💰':'🎟️'}</span><span class="coupon-badge">${o.coinCost} RC</span><h3>${esc(o.name)}</h3><p>${esc(o.description||'Oferta exclusiva para miembros.')}</p><p><b style="color:#9bdcff">${o.type==='wallet'?cash(o.value)+' de saldo':Number(o.value)+'% de descuento'}</b></p><button class="btn btn-primary btn-small" onclick="redeemSpecialOffer('${o.id}')">Canjear por ${o.coinCost} RC</button></article>`).join('')||empty('🎁','No hay ofertas especiales activas ahora mismo.')}</div>`}
function redeemSpecialOffer(id){if(!requireAccount())return;const o=db.specialOffers.find(x=>x.id===id&&x.active);if(!o)return toast('La oferta ya no está disponible');if(db.coins<o.coinCost)return toast('No tienes suficientes RefillCoins');if(!confirm(`¿Canjear ${o.coinCost} RefillCoins por «${o.name}»?`))return;addCoinLedger(-o.coinCost,'Canje: '+o.name,'redeem-'+Date.now());let rewardCode='';if(o.type==='wallet'){db.balance=Number((db.balance+Number(o.value)).toFixed(2));db.ledger.unshift({ts:Date.now(),date:new Date().toLocaleString('es-ES'),description:'Premio RefillCoins: '+o.name,type:'Crédito',amount:Number(o.value),balanceAfter:db.balance})}else{rewardCode=createPersonalCoupon(Number(o.value),'COIN');}persist();render();toast(rewardCode?'Canje completado · cupón '+rewardCode:'Premio canjeado correctamente')}
function accountGate(label){return `<section class="login-card"><span class="eyebrow">REFILLS SHOP · CUENTA</span><h1>${esc(label)}</h1><p>Inicia sesión o crea una cuenta para usar esta sección y guardar tu actividad.</p><button class="btn btn-primary" onclick="navigate('cuenta')">Crear cuenta / Entrar ↗</button></section>`}
function saveLoyaltySettings(e){e.preventDefault();const coinsPerUsd=Number(document.getElementById('loyCoinsPerUsd').value),rouletteCost=Number(document.getElementById('loyRouletteCost').value),referrer=Number(document.getElementById('loyReferrer').value),friend=Number(document.getElementById('loyFriend').value),minSpend=Number(document.getElementById('loyMinSpend').value);if(![coinsPerUsd,rouletteCost,referrer,friend,minSpend].every(Number.isFinite)||coinsPerUsd<1||coinsPerUsd>100||!Number.isInteger(coinsPerUsd)||rouletteCost<1||referrer<0||friend<0||minSpend<0)return toast('Revisa los valores de recompensas');db.loyalty={...db.loyalty,coinsPerUsd,rouletteCost,referralInviterCoins:referrer,referralFriendCoins:friend,referralMinSpend:minSpend};persist();render();toast('Reglas de RefillCoins guardadas')}
function adminLoyalty(){const l=db.loyalty;return `<div class="section-head"><div><h2>RefillCoins y recompensas</h2><p>Define cómo se ganan, cómo se gastan y qué recompensa reciben los usuarios invitados.</p></div></div><section class="panel"><form onsubmit="saveLoyaltySettings(event)"><div class="form-grid"><label class="field"><span>RefillCoins por cada USD acumulado</span><input id="loyCoinsPerUsd" type="number" min="1" max="100" step="1" value="${l.coinsPerUsd}" required></label><label class="field"><span>Coste de un giro de ruleta (RC)</span><input id="loyRouletteCost" type="number" min="1" step="1" value="${l.rouletteCost}" required></label><label class="field"><span>Recompensa para quien invita (RC)</span><input id="loyReferrer" type="number" min="0" step="1" value="${l.referralInviterCoins}" required></label><label class="field"><span>Recompensa para el amigo (RC)</span><input id="loyFriend" type="number" min="0" step="1" value="${l.referralFriendCoins}" required></label><label class="field"><span>Gasto mínimo completado para activar invitación (USD)</span><input id="loyMinSpend" type="number" min="0" step="0.5" value="${l.referralMinSpend}" required></label></div><button class="btn btn-primary" type="submit">Guardar reglas de recompensas</button></form><p class="security-note">Las monedas se acreditan solamente cuando un pedido pasa a Completado. Los depósitos de Wallet no generan monedas. La ruleta usa monedas ganadas, no pagos en dinero real.</p></section><div class="section-head"><div><h2>Canjes disponibles</h2><p>Gestiona las ofertas que se compran con RefillCoins.</p></div><button class="btn btn-primary btn-small" onclick="editSpecialOffer()">＋ Nueva recompensa</button></div><section class="panel"><div class="table-scroll"><table class="list-table"><thead><tr><th>RECOMPENSA</th><th>COSTE</th><th>PREMIO</th><th>ESTADO</th><th>ACCIONES</th></tr></thead><tbody>${(db.specialOffers||[]).map(o=>`<tr><td><b>${esc(o.name)}</b><br><small class="muted">${esc(o.description||'')}</small></td><td>${o.coinCost} RC</td><td>${o.type==='wallet'?cash(o.value)+' Wallet':Number(o.value)+'% cupón'}</td><td>${statusBadge(o.active?'Completado':'Pausado')}</td><td><div class="admin-action-row"><button class="filter-chip" onclick="editSpecialOffer('${o.id}')">Editar</button><button class="filter-chip" onclick="toggleSpecialOffer('${o.id}')">${o.active?'Pausar':'Activar'}</button><button class="filter-chip danger-chip" onclick="deleteSpecialOffer('${o.id}')">Eliminar</button></div></td></tr>`).join('')}</tbody></table></div></section>`}
function editSpecialOffer(id){const o=id?db.specialOffers.find(x=>x.id===id):null;modal(`<span class="eyebrow">RECOMPENSA DE PUNTOS</span><h2>${o?'Editar recompensa':'Crear recompensa'}</h2><form onsubmit="saveSpecialOffer(event,${o?`'${o.id}'`:'null'})"><label class="field"><span>Nombre visible</span><input id="spName" maxlength="70" required value="${esc(o?.name||'')}"></label><label class="field"><span>Descripción</span><textarea id="spDesc" maxlength="180">${esc(o?.description||'')}</textarea></label><div class="form-grid"><label class="field"><span>Coste en RefillCoins</span><input id="spCost" type="number" min="1" step="1" required value="${o?.coinCost??50}"></label><label class="field"><span>Tipo de premio</span><select id="spType"><option value="wallet" ${o?.type!=='coupon'?'selected':''}>Crédito Wallet (USD)</option><option value="coupon" ${o?.type==='coupon'?'selected':''}>Cupón de descuento (%)</option></select></label></div><label class="field"><span>Valor (USD o porcentaje, según tipo)</span><input id="spValue" type="number" min="0.01" step="0.01" required value="${o?.value??0.5}"></label><button class="btn btn-primary" type="submit">Guardar recompensa</button></form>`)}
function saveSpecialOffer(e,id){e.preventDefault();const data={name:document.getElementById('spName').value.trim(),description:document.getElementById('spDesc').value.trim(),coinCost:Math.floor(Number(document.getElementById('spCost').value)),type:document.getElementById('spType').value,value:Number(document.getElementById('spValue').value),active:id?Boolean(db.specialOffers.find(x=>x.id===id)?.active):true};if(!data.name||data.coinCost<1||!Number.isFinite(data.value)||data.value<=0||(data.type==='coupon'&&data.value>80))return toast('Comprueba los datos de la recompensa');if(id)Object.assign(db.specialOffers.find(x=>x.id===id),data);else db.specialOffers.push({id:'special-'+Date.now(),...data});persist();closeModal();render();toast('Recompensa guardada')}
function toggleSpecialOffer(id){const o=db.specialOffers.find(x=>x.id===id);if(!o)return;o.active=!o.active;persist();render();toast(o.active?'Recompensa activada':'Recompensa pausada')}
function deleteSpecialOffer(id){if(!confirm('¿Eliminar esta recompensa?'))return;db.specialOffers=db.specialOffers.filter(x=>x.id!==id);persist();render();toast('Recompensa eliminada')}
function adminUsers(){return `<div class="section-head"><div><h2>Cuentas registradas</h2><p>Vista local de los usuarios creados en este navegador. Nunca se muestra el PIN.</p></div><span class="coupon-badge">${db.users.length} cuentas</span></div><section class="panel">${db.users.length?`<div class="table-scroll"><table class="list-table"><thead><tr><th>USUARIO</th><th>TELÉFONO / WHATSAPP</th><th>INVITACIÓN</th><th>GASTO ACUMULADO</th><th>REFILLCOINS</th><th>ESTADO</th><th>ACCIONES</th></tr></thead><tbody>${db.users.map(u=>`<tr><td><b>${esc(u.name)}</b><br><small class="muted">${esc(u.createdAt||'')}</small></td><td>${esc(u.phone)}<br><span class="wa-status ${u.phoneVerified?'verified':'unverified'}">${u.phoneVerified?'Verificado':'No verificado'}</span><br><small class="muted">Avisos: ${u.whatsappNotifications?'sí':'no'}</small></td><td>${esc(u.referralCode)}<br><small class="muted">${db.users.filter(x=>x.invitedBy===u.id).length} amigos</small></td><td>${cash(u.id===db.sessionUserId?db.eligibleSpend:u.eligibleSpend||0)}</td><td><b>${coinsForAccount(u)} RC</b></td><td>${statusBadge(u.active===false?'Rechazado':'Completado')}</td><td><div class="admin-action-row"><button class="filter-chip" onclick="adminAdjustCoins('${u.id}')">Ajustar RC</button><button class="filter-chip" onclick="adminToggleUser('${u.id}')">${u.active===false?'Activar':'Desactivar'}</button></div></td></tr>`).join('')}</tbody></table></div>`:empty('♙','Todavía no hay cuentas registradas en este navegador.')}</section><p class="security-note">Para que todos los usuarios vean sus cuentas desde cualquier teléfono o PC, hay que conectar Auth + base de datos remota. Esta tabla es solamente la demo local.</p>`}
function adminAdjustCoins(id){const u=db.users.find(x=>x.id===id);if(!u)return;const amount=Number(prompt('Cantidad de RefillCoins que se sumarán o restarán. Ejemplo: 5 o -3','5'));if(!Number.isInteger(amount)||!amount)return toast('Introduce un entero distinto de cero');const currentBalance=coinsForAccount(u);if(currentBalance+amount<0)return toast('El saldo no puede quedar negativo');if(id===db.sessionUserId){addCoinLedger(amount,'Ajuste administrativo','admin-adjust-'+Date.now())}else{u.coins=Math.max(0,Number(u.coins||0)+amount);u.coinLedger=u.coinLedger||[];u.coinLedger.unshift({id:'RC-'+Date.now(),date:new Date().toLocaleString('es-ES'),description:'Ajuste administrativo',amount,balanceAfter:u.coins})}persist();render();toast('Saldo de RefillCoins ajustado')}
function adminToggleUser(id){const u=db.users.find(x=>x.id===id);if(!u)return;u.active=u.active===false?true:false;persist();render();toast(u.active?'Cuenta activada':'Cuenta desactivada')}
function allOwnedOrders(){const out=[];for(const u of db.users){const arr=u.id===db.sessionUserId?db.orders:(u.orders||[]);for(const o of arr)out.push({order:o,user:u})}return out}
function allOwnedDeposits(){const out=[];for(const u of db.users){const arr=u.id===db.sessionUserId?db.deposits:(u.deposits||[]);for(const d of arr)out.push({deposit:d,user:u})}return out}
function findOrderOwner(orderId){for(const pair of allOwnedOrders())if(pair.order.id===orderId)return pair;return null}
function findDepositOwner(depositId){for(const pair of allOwnedDeposits())if(pair.deposit.id===depositId)return pair;return null}
function completeOrderRewards(user,order,isCurrent){const amount=Math.max(0,Number(order.amount)||0),before=isCurrent?Number(db.eligibleSpend||0):Number(user.eligibleSpend||0),after=Number((before+amount).toFixed(2));if(isCurrent)db.eligibleSpend=after;else user.eligibleSpend=after;const rate=Math.max(1,Math.floor(Number(db.loyalty.coinsPerUsd)||1)),earned=(Math.floor(after)*rate)-(Math.floor(before)*rate);if(earned>0)grantCoinsToUser(user.id,earned,'Compra completada: '+order.offerName,order.id);order.coinsAwarded=earned;const referralPaid=isCurrent?db.referralRewardPaid:Boolean(user.referralRewardPaid);if(user.invitedBy&&!referralPaid&&after>=Number(db.loyalty.referralMinSpend||0)){if(isCurrent)db.referralRewardPaid=true;else user.referralRewardPaid=true;grantCoinsToUser(user.id,Number(db.loyalty.referralFriendCoins)||0,'Recompensa por invitación: primera meta completada', 'referral-friend-'+user.id);grantCoinsToUser(user.invitedBy,Number(db.loyalty.referralInviterCoins)||0,'Tu amigo completó su meta de invitación','referral-inviter-'+user.id)}}
function methodName(id){return db.methods.find(m=>m.id===id)?.name||id}
function gameById(id){return db.games.find(g=>g.id===id)}
function offerById(id){return db.offers.find(o=>o.id===id)}
function activeOffers(gameId){return db.offers.filter(o=>o.active&&(!gameId||o.gameId===gameId)&&gameById(o.gameId)?.active)}
function productEquiv(price,offer=null){const effective=offer?effectiveSalePrice(offer):Math.max(.01,Number((Number(price)||.01).toFixed(2)));const sm=Math.round(effective*Number(db.rates.sm||1));const cup=Math.round(effective*Number(db.rates.cup||1));const manual=offer&&Number(offer.usdtPrice)>0?Number(offer.usdtPrice):null;return {cup,sm,usdt:manual}}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2800)}
function updateHeader(){const el=document.getElementById('topBalance');if(el)el.textContent=cash(db.balance)+' USD';const u=currentUser();const coins=document.getElementById('topCoins');if(coins)coins.textContent=Number(db.coins||0)+' RC';const name=document.getElementById('topName');if(name)name.textContent=u?u.name:'Entrar / Registrarse';const avatar=document.getElementById('topAvatar');if(avatar)avatar.textContent=u?(u.name.trim()[0]||'U').toUpperCase():'R';const brand=(db.settings.brand||'REFILLS SHOP').trim().split(/\s+/);document.querySelectorAll('.brand-name').forEach(n=>{n.innerHTML=brand.length>1?esc(brand.slice(0,-1).join(' '))+' <span>'+esc(brand[brand.length-1])+'</span>':esc(brand[0]||'REFILLS')});const accent=/^#[0-9a-fA-F]{6}$/.test(db.settings.accent||'')?db.settings.accent:'#2d8cff';document.documentElement.style.setProperty('--blue',accent);document.documentElement.style.setProperty('--brand-accent',accent);document.title=(db.settings.brand||'REFILLS SHOP')+' — Gaming top-ups'}
function navigate(route){if(route==='admin'){location.hash='admin';return}location.hash=route}
function routeParts(){let h=decodeURIComponent(location.hash.slice(1)||'inicio');return h.split('/').filter(Boolean)}
function syncNav(route){document.querySelectorAll('[data-route]').forEach(b=>b.classList.toggle('active',b.dataset.route===route||(route.startsWith('game')&&b.dataset.route==='juegos')))}
function safeImageURL(value){try{const u=new URL(String(value||''),location.href);return ['http:','https:'].includes(u.protocol)?u.href:''}catch(e){return ''}}
function gameImageURL(gameId){const g=gameById(gameId);return safeImageURL(g?.image)||safeImageURL(imageSources[gameId])}

"muted" style="display:block;font-size:9px">${esc(a.type)} · ${esc(a.date)}</small></div>${statusBadge(a.status)}</div>`).join('')||empty('◈','Todavía no hay actividad registrada.')}</section></div>`}
function adminOffers(){const margin=db.offers.length?db.offers.reduce((n,o)=>n+effectiveSalePrice(o)-Number(o.cost||0),0)/db.offers.length:0;const gameSections=db.games.map((g,gameIndex)=>{const offers=db.offers.filter(o=>o.gameId===g.id);return `<section class="panel subsection"><div class="section-head" style="margin-top:0"><div><h2>${esc(g.icon||'🎮')} ${esc(g.name)}</h2><p>${offers.length} ofertas · ${offers.filter(o=>o.active).length} activas · ${g.active?'Juego visible':'Juego pausado'}</p></div><div class="admin-action-row"><button class="filter-chip" title="Subir juego" onclick="moveGame('${g.id}',-1)" ${gameIndex===0?'disabled':''}>↑ Juego</button><button class="filter-chip" title="Bajar juego" onclick="moveGame('${g.id}',1)" ${gameIndex===db.games.length-1?'disabled':''}>↓ Juego</button><button class="btn btn-primary btn-small" onclick="editOffer(null,'${g.id}')">＋ Oferta para ${esc(g.name)}</button></div></div>${offers.length?`<div class="table-scroll"><table class="list-table"><thead><tr><th>ORDEN</th><th>OFERTA / ENTREGA</th><th>COSTE REAL</th><th>PRECIO WEB</th><th>VENTA EN SM</th><th>USDT</th><th>GANANCIA BRUTA</th><th>ESTADO</th><th>ACCIONES</th></tr></thead><tbody>${offers.map((o,offerIndex)=>{const eq=productEquiv(effectiveSalePrice(o),o),profit=effectiveSalePrice(o)-Number(o.cost);return `<tr><td><div class="admin-action-row"><button class="filter-chip" title="Subir oferta" onclick="moveOffer('${o.id}',-1)" ${offerIndex===0?'disabled':''}>↑</button><button class="filter-chip" title="Bajar oferta" onclick="moveOffer('${o.id}',1)" ${offerIndex===offers.length-1?'disabled':''}>↓</button></div><span class="muted">${offerIndex+1}</span></td><td><b>${esc(o.name)}</b><br><span class="muted">${esc(o.description||'')}${o.featured?' · Destacada':''}</span><br><span class="coupon-badge">${esc(deliveryTypeLabel(o.deliveryType))}</span>${o.redemptionNote?`<br><span class="muted">Nota: ${esc(o.redemptionNote)}</span>`:''}</td><td><b>${cash(o.cost)}</b><br><span class="muted">${o.costMode==='credit'?`${num(o.providerCreditAmount||0)} crédito proveedor`:'Coste directo'}</span></td><td><b>${cash(o.price)} USD</b><br><span class="muted">${numWhole(eq.cup)} CUP</span></td><td>${numWhole(eq.sm)} SM${o.priceMode==='sm'?'<br><span class="muted">Precio ajustado a USD entero</span>':''}</td><td>${Number(o.usdtPrice)>0?num(o.usdtPrice):'—'}<br><span class="muted">${Number(o.usdtPrice)>0?'Manual':'Sin definir'}</span></td><td style="color:${profit>=0?'#58ddb4':'#ff8296'}"><b>${cash(profit)}</b><br><span class="muted">${num(effectiveSalePrice(o)>0?profit/effectiveSalePrice(o)*100:0)}% margen</span></td><td><span class="status ${o.active?'ok':'bad'}">${o.active?'Activa':'Pausada'}</span></td><td><div class="admin-action-row"><button class="filter-chip" onclick="editOffer('${o.id}')">Editar</button><button class="filter-chip" onclick="toggleOffer('${o.id}')">${o.active?'Pausar':'Activar'}</button><button class="filter-chip danger-chip" onclick="deleteOffer('${o.id}')">Eliminar</button></div></td></tr>`}).join('')}</tbody></table></div>`:empty('▦','Este juego todavía no tiene ofertas. Usa “Oferta para '+esc(g.name)+'” para crear la primera.')}</section>`}).join('');return `<div class="section-head"><div><h2>Ofertas por juego</h2><p>Ordena juegos con las flechas de cada encabezado y ofertas con las flechas de cada fila. El orden se refleja en la tienda.</p></div><button class="btn btn-primary btn-small" onclick="editOffer()">＋ Nueva oferta</button></div><div class="admin-stats"><div class="admin-stat"><small>OFERTAS CREADAS</small><strong>${db.offers.length}</strong><em>Incluye pausadas</em></div><div class="admin-stat"><small>OFERTAS ACTIVAS</small><strong>${db.offers.filter(o=>o.active).length}</strong><em>Visibles en tienda</em></div><div class="admin-stat"><small>MARGEN BRUTO MEDIO</small><strong>${cash(margin)}</strong><em>Antes de gastos</em></div><div class="admin-stat"><small>MONEDA BASE</small><strong>USD manual</strong><em>Hasta 2 decimales; CUP/SM automáticos</em></div></div><section class="panel"><h3>Reglas de precio</h3><p class="muted" style="font-size:11px;line-height:1.8;margin:0">El precio de venta USD se introduce manualmente con hasta 2 decimales. CUP y SM se recalculan automáticamente como números enteros según las tasas. USDT es manual por oferta y no cambia al modificar tasas.</p></section>${gameSections}`}

function adminGames(){return `<div class="section-head"><div><h2>Juegos y catálogo</h2><p>Edita la información pública, imágenes, color, categoría y disponibilidad de cada juego.</p></div><button class="btn btn-primary btn-small" onclick="editGame()">＋ Nuevo juego</button></div><div class="notice" style="margin-bottom:16px">El juego de portada se selecciona en <b>Configuración</b>. Free Fire permanece en el catálogo, pero no es el protagonista por defecto.</div><div class="game-grid">${db.games.map(g=>`<article class="game-card"><div class="game-cover" style="--game-a:${esc(g.color)}">${imageHTML(g.id)}<div class="cover-shade"></div><span class="game-icon">${esc(g.icon)}</span><span class="game-tag">${g.active?'ACTIVO':'PAUSADO'}</span></div><div class="game-info"><h3>${esc(g.name)}</h3><p>${esc(g.category)} · ${esc(g.description)}</p><div class="game-foot"><button onclick="moveGame('${g.id}',-1)" title="Subir juego">↑</button><button onclick="moveGame('${g.id}',1)" title="Bajar juego">↓</button><button onclick="editGame('${g.id}')">Editar</button><button onclick="toggleGame('${g.id}')">${g.active?'Pausar':'Activar'}</button><button onclick="deleteGame('${g.id}')">Eliminar</button></div></div></article>`).join('')}</div>`}
function adminRates(){const o=activeOffers()[0];const price=o?effectiveSalePrice(o):1;return `<div class="section-head"><div><h2>Tasas y coste de compra</h2><p>USD es el precio base manual de cada oferta. Solo CUP y SM se calculan automáticamente; USDT se define por separado dentro de cada oferta.</p></div></div><section class="panel"><form onsubmit="saveRates(event)"><div class="form-grid"><label class="field"><span>1 USD = CUP</span><input id="rateCUP" type="number" min="0.0001" step="0.01" value="${db.rates.cup}" required></label><label class="field"><span>1 USD = saldo móvil (SM)</span><input id="rateSM" type="number" min="0.0001" step="0.01" value="${db.rates.sm}" required><small>Solo actualiza las equivalencias SM; nunca cambia el precio USD manual de una oferta.</small></label><label class="field"><span>USDT general para cálculos de Wallet</span><input id="rateUSDT" type="number" min="0.0001" step="0.0001" value="${db.rates.usdt}" required><small>Esta tasa no fija el precio USDT de los productos. Cada oferta tiene su precio USDT manual.</small></label><label class="field"><span>Saldo nominal del proveedor por cada USD pagado</span><input id="rateBuyCreditFactor" type="number" min="0.0001" step="0.0001" value="${db.rates.buyCreditFactor||1}" required><small>Ejemplo: pagas $90 y recibes $100 de saldo nominal → factor 1.1111. Coste real = consumo nominal ÷ factor.</small></label></div><div class="notice" style="margin:5px 0 16px"><b>Vista previa</b><br>${o?esc(o.name)+': ':''}${cash(price)} USD = ${numWhole(Math.round(price*db.rates.cup))} CUP · ${numWhole(Math.round(price*db.rates.sm))} SM.${o&&Number(o.usdtPrice)>0?` USDT manual de esta oferta: ${num(o.usdtPrice)}.`:' USDT de producto: se configura manualmente en cada oferta.'}<br>Modificar tasas CUP/SM no modifica el precio USD. Las ofertas que usan saldo nominal del proveedor actualizarán su coste real si cambia el factor.</div><button class="btn btn-primary" type="submit">Guardar tasas</button></form></section><div class="notice" style="margin-top:14px">Las tasas son definidas por administración. El USDT que aparece en las ofertas solo se muestra cuando introduces un importe manual en esa oferta.</div>`}
function adminDeposits(){const items=allOwnedDeposits();return `<div class="section-head"><div><h2>Solicitudes de depósito</h2><p>Aprueba solo después de verificar el pago fuera de esta demo.</p></div></div><section class="panel">${items.length?`<div class="table-scroll"><table class="list-table"><thead><tr><th>USUARIO / FECHA / ID</th><th>MÉTODO</th><th>IMPORTE</th><th>REFERENCIA</th><th>ESTADO</th><th>ACCIÓN</th></tr></thead><tbody>${items.map(({deposit:d,user:u})=>`<tr><td>${esc(u.name)}<br><span class="muted">${esc(u.phone)} · ${esc(d.date)}<br>${esc(d.id)}</span></td><td>${esc(methodName(d.method))}<br><span class="muted">${num(d.localAmount)} ${esc(d.localUnit)}</span></td><td>${cash(d.amount)}</td><td>${esc(d.reference||'—')}</td><td>${statusBadge(d.status)}</td><td>${d.status==='Pendiente'?`<button class="filter-chip" onclick="decideDeposit('${d.id}','Aprobado')">Aprobar</button><button class="filter-chip" onclick="decideDeposit('${d.id}','Rechazado')">Rechazar</button>`:'—'}</td></tr>`).join('')}</tbody></table></div>`:empty('⇧','No hay depósitos pendientes ni anteriores.')}</section>`}
function adminOrders(){const items=allOwnedOrders();return `<div class="section-head"><div><h2>Gestión de pedidos</h2><p>Actualiza manualmente el estado de los pedidos en esta demo.</p></div><button class="btn btn-secondary btn-small" onclick="exportOrders()">Exportar CSV ↓</button></div><section class="panel">${items.length?`<div class="table-scroll"><table class="list-table"><thead><tr><th>USUARIO / FECHA / PEDIDO</th><th>PRODUCTO / JUEGO</th><th>DATOS DE ENTREGA</th><th>IMPORTE</th><th>ESTADO</th><th>CAMBIAR</th></tr></thead><tbody>${items.map(({order:o,user:u})=>`<tr><td>${esc(u.name)}<br><span class="muted">${esc(u.phone)} · ${esc(o.date)}<br>#${esc(o.id)}</span></td><td>${esc(o.offerName)}<br><span class="muted">${esc(o.gameName)}</span></td><td>${orderDeliverySummary(o)}</td><td>${cash(o.amount)}</td><td>${statusBadge(o.status)}</td><td><select onchange="setOrderStatus('${o.id}',this.value)" style="background:#07162b;color:#fff;border:1px solid #28435f;padding:7px;border-radius:8px;font-size:10px"><option ${o.status==='Pendiente'?'selected':''}>Pendiente</option><option ${o.status==='Procesando'?'selected':''}>Procesando</option><option ${o.status==='Completado'?'selected':''}>Completado</option><option ${o.status==='Fallido'?'selected':''}>Fallido</option></select></td></tr>`).join('')}</tbody></table></div>`:empty('▤','No hay pedidos todavía.')}</section>`}
function adminMethods(){return `<div class="section-head"><div><h2>Métodos de pago</h2><p>Activa métodos, cambia el nombre, las instrucciones y la moneda que usa la tasa.</p></div><button class="btn btn-primary btn-small" onclick="addMethod()">＋ Nuevo método</button></div><div class="admin-content-grid">${db.methods.map(m=>{const unit=m.unit||(m.id==='sm'?'sm':m.id==='usdt'?'usdt':'cup');return `<section class="panel"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:15px"><h3 style="margin:0">${esc(m.name)}</h3><button class="filter-chip ${m.enabled?'active':''}" onclick="toggleMethod('${m.id}')">${m.enabled?'Activo':'Pausado'}</button></div><label class="field"><span>Nombre visible</span><input id="method-name-${m.id}" value="${esc(m.name)}"></label><label class="field"><span>Moneda para calcular el equivalente</span><select id="method-unit-${m.id}"><option value="cup" ${unit==='cup'?'selected':''}>CUP</option><option value="sm" ${unit==='sm'?'selected':''}>Saldo móvil (SM)</option><option value="usdt" ${unit==='usdt'?'selected':''}>USDT</option></select></label><label class="field"><span>Instrucciones para el cliente</span><textarea id="method-instr-${m.id}">${esc(m.instructions)}</textarea></label><button class="btn btn-secondary btn-small" onclick="saveMethod('${m.id}')">Guardar método</button></section>`}).join('')}</div>`}
function adminCoupons(){return `<div class="section-head"><div><h2>Cupones promocionales</h2><p>Los clientes pueden introducir un código al comprar un pack.</p></div><button class="btn btn-primary btn-small" onclick="editCoupon()">＋ Crear cupón</button></div><section class="panel">${db.coupons.length?`<div class="table-scroll"><table class="list-table"><thead><tr><th>CÓDIGO</th><th>DESCUENTO</th><th>ESTADO</th><th>ACCIÓN</th></tr></thead><tbody>${db.coupons.map(c=>`<tr><td><b>${esc(c.code)}</b></td><td>${Number(c.percent)}%</td><td>${statusBadge(c.active?'Completado':'Rechazado')}</td><td><button class="filter-chip" onclick="toggleCoupon('${esc(c.code)}')">${c.active?'Pausar':'Activar'}</button> <button class="filter-chip danger-chip" onclick="deleteCoupon('${esc(c.code)}')">Eliminar</button></td></tr>`).join('')}</tbody></table></div>`:empty('％','Todavía no has creado cupones.')}</section><p class="muted" style="font-size:10px;margin-top:12px">Los cupones son parte de la demo local; en producción deben validarse y aplicarse en el servidor para impedir manipulaciones.</p>`}
function lioGetPublicConfig(){try{return JSON.parse(localStorage.getItem('REFILLS_LIO_PUBLIC_CONFIG')||'{}')}catch(e){return {}}}
function lioGetMappings(){try{return JSON.parse(localStorage.getItem('REFILLS_LIO_LOCAL_MAPPINGS')||'{}')}catch(e){return {}}}
function adminLioGames(){const c=lioGetPublicConfig(),maps=lioGetMappings();return `<div class="section-head"><div><span class="eyebrow">INTEGRACIÓN DE PROVEEDOR</span><h2>Distribution Hub · LioGames</h2><p>Fase 1: leer catálogo, variaciones, requisitos y precios publicados. Esta pantalla no crea pedidos con dinero real.</p></div><span class="coupon-badge">${Object.keys(maps).length} vinculaciones locales</span></div><div class="danger-note"><b>Modo seguro:</b> el catálogo público se puede consultar aquí. El saldo del proveedor y los pedidos Sandbox necesitarán autenticar al administrador con Supabase y configurar los secretos del backend. Nunca pegues el secreto HMAC de LioGames en esta página.</div><section class="panel subsection"><h3>1 · Conectar con la función de Supabase</h3><p class="muted">Primero debes desplegar <code>liogames-gateway</code> siguiendo el README. Introduce únicamente la Project URL base (por ejemplo https://abcdefgh.supabase.co, sin rutas) y la clave pública (publishable/anon). No uses el enlace del Dashboard ni el secreto del proveedor.</p><form onsubmit="saveLioPublicConfig(event)"><div class="form-grid"><label class="field"><span>Supabase Project URL</span><input id="lioSupabaseUrl" type="url" placeholder="https://TU-PROYECTO.supabase.co" value="${esc(c.url||'')}" required></label><label class="field"><span>Clave pública (publishable / anon)</span><input id="lioSupabasePublicKey" type="password" autocomplete="off" placeholder="sb_publishable_… o clave anon" value="${esc(c.publicKey||'')}" required><small>Solo clave pública. No introduzcas service_role ni el secreto de LioGames.</small></label></div><div class="admin-action-row"><button class="btn btn-primary" type="submit">Guardar conexión</button><button class="btn btn-secondary" type="button" onclick="lioTestConnection()">Probar API y catálogo</button></div></form><div id="lioConnectionStatus" class="notice" style="margin-top:14px">${c.url&&c.publicKey?'Configuración local guardada. Pulsa “Probar API y catálogo”.':'Configura la URL y la clave pública cuando la función esté desplegada.'}</div></section><section class="panel subsection"><div class="section-head" style="margin-top:0"><div><h3>2 · Catálogo de LioGames</h3><p>Obtén los IDs reales de productos y paquetes para vincularlos con las ofertas de REFILLS SHOP.</p></div><button type="button" class="btn btn-primary btn-small" onclick="lioLoadProducts()">↻ Cargar productos</button></div><div class="toolbar" style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px"><input id="lioProductSearch" class="search-input" style="min-width:220px;flex:1" placeholder="Buscar juego o ID del proveedor…" oninput="lioFilterProducts()"><span id="lioProductCount" class="coupon-badge">Catálogo sin cargar</span></div><div id="lioProductsResults"><div class="empty">Pulsa “Cargar productos” para consultar el catálogo oficial.</div></div><div id="lioDetailsResults" style="margin-top:16px"></div></section><section class="panel subsection"><h3>3 · Próximo paso: probar Sandbox</h3><p>Una vez confirmado el catálogo, configuraremos la autenticación administrativa, los secretos HMAC, consulta de saldo y pedidos de Sandbox. No habilitaremos pedidos reales hasta verificar correctamente el flujo completo, el coste y la protección contra pedidos duplicados.</p><div class="filter-row"><span class="filter-chip">1. Catálogo</span><span class="filter-chip">2. Variación exacta</span><span class="filter-chip">3. Esquema de campos</span><span class="filter-chip">4. Precio proveedor</span><span class="filter-chip">5. Sandbox</span></div><p class="muted" style="font-size:11px">Documentación oficial: <a href="https://distribution.liogames.com/developers/" target="_blank" rel="noopener">distribution.liogames.com/developers</a></p></section>`}
function saveLioPublicConfig(e){e.preventDefault();const rawUrl=document.getElementById('lioSupabaseUrl').value.trim();const publicKey=document.getElementById('lioSupabasePublicKey').value.trim();let url;try{const u=new URL(rawUrl);if(u.protocol!=='https:'&&u.hostname!=='localhost')throw new Error('La URL debe usar HTTPS.');if(u.pathname!=='/'||u.search||u.hash)throw new Error('Pega solo la Project URL base, sin /functions/v1, sin el nombre de la función y sin el enlace del Dashboard.');url=u.origin;}catch(err){return toast(err.message||'Introduce una URL de Supabase válida.')}if(publicKey.length<20)return toast('La clave pública parece incompleta.');localStorage.setItem('REFILLS_LIO_PUBLIC_CONFIG',JSON.stringify({url,publicKey}));render();toast('Conexión pública guardada en este navegador.')}
async function lioCall(action,params={}){const c=lioGetPublicConfig();if(!c.url||!c.publicKey)throw new Error('Primero guarda la URL de Supabase y la clave pública.');let endpoint;try{const u=new URL(c.url);if(u.pathname!=='/'||u.search||u.hash)throw new Error('La Project URL debe ser solo el origen, por ejemplo https://abcdefgh.supabase.co, sin /functions/v1 ni enlaces del Dashboard.');endpoint=u.origin+'/functions/v1/liogames-gateway';}catch(err){throw new Error(err.message||'La URL de Supabase no es válida.')}let resp;try{resp=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json','apikey':c.publicKey,'Authorization':'Bearer '+c.publicKey},body:JSON.stringify({action,...params})})}catch(err){const detail=err&&err.message?err.message:String(err);throw new Error('El navegador no pudo completar la petición (red o CORS). Endpoint consultado: '+endpoint+'. Comprueba que exista una Edge Function publicada con el nombre exacto liogames-gateway en ese mismo proyecto. Detalle del navegador: '+detail)}const raw=await resp.text();let payload;try{payload=raw?JSON.parse(raw):{}}catch(e){throw new Error('Supabase respondió HTTP '+resp.status+' pero no devolvió JSON. Endpoint: '+endpoint+'. Respuesta inicial: '+raw.slice(0,180))}if(!resp.ok||payload.ok===false&&payload.error)throw new Error((payload.error||payload.message||payload.msg||('Error HTTP '+resp.status))+' (HTTP '+resp.status+'). Endpoint: '+endpoint);return payload}
function lioSetStatus(message,ok=false){const el=document.getElementById('lioConnectionStatus');if(el)el.innerHTML=`<b style="color:${ok?'#38d9a3':'#ffbd69'}">${ok?'✓ ':'! '}</b>${esc(message)}`}
async function lioTestConnection(){lioSetStatus('Probando conexión…');try{const ping=await lioCall('ping');const d=ping.data||ping;const message=d.message||d.data?.message||'La API respondió correctamente.';lioSetStatus('Edge Function conectada. LioGames: '+message,true);await lioLoadProducts(false)}catch(e){lioSetStatus(e.message);toast(e.message)}}
function lioExtractArray(value,depth=0){if(depth>5||value==null)return[];if(Array.isArray(value))return value;if(typeof value!=='object')return[];for(const key of ['products','variations','items','results','catalog','data','rows']){if(value[key]!=null){const found=lioExtractArray(value[key],depth+1);if(found.length)return found}}return[]}
function lioFindId(p){const id=p?.product_id??p?.variation_id??p?.id??p?.productId??p?.variationId;return id==null?'':String(id)}
function lioProductLabel(p){return p?.name||p?.product_name||p?.title||p?.label||p?.variation_name||p?.package_name||('Producto '+lioFindId(p))}

async function lioLoadProducts(showToast=true){const holder=document.getElementById('lioProductsResults');if(holder)holder.innerHTML='<div class="notice">Consultando catálogo de Distribution Hub…</div>';try{const response=await lioCall('products');const data=response.data??response;const rows=lioExtractArray(data);window.__lioProductCache=rows;if(holder&&rows.length===0){holder.innerHTML=`<div class="notice">La conexión respondió, pero no pude reconocer la lista de productos. Consulta la respuesta bruta.</div><pre class="lio-json">${esc(JSON.stringify(data,null,2))}</pre>`}else lioRenderProducts(rows);const c=document.getElementById('lioProductCount');if(c)c.textContent=rows.length+' productos';lioSetStatus('Catálogo recibido de LioGames: '+rows.length+' productos.',true);if(showToast)toast('Catálogo cargado: '+rows.length+' productos.')}catch(e){if(holder)holder.innerHTML=`<div class="empty">${esc(e.message)}</div>`;lioSetStatus(e.message);if(showToast)toast(e.message)}}

sc(o.redemptionNote)}</div>`:''}<label class="field"><span>Cupón de descuento (opcional)</span><input id="buyCoupon" placeholder="Introduce tu código"></label><div class="notice" id="buyPricePreview">Precio: ${cash(effectiveSalePrice(o))} USD · ≈ ${numWhole(effectiveSalePrice(o)*db.rates.cup)} CUP</div><div class="modal-total"><span>Importe total</span><b id="buyTotal">${cash(effectiveSalePrice(o))}</b></div><p class="muted" style="font-size:11px">Wallet disponible: ${cash(db.balance)}. La compra genera un pedido de demostración; aún no conecta con el proveedor.</p><button class="btn btn-primary" type="submit">Confirmar pedido ↗</button></form>`);const c=document.getElementById('buyCoupon');c.addEventListener('input',()=>updateBuyPreview(o));updateBuyPreview(o)}

function confirmBuy(e,id){e.preventDefault();if(!requireAccount())return;const o=offerById(id);if(!o||!o.active)return toast('Esta oferta no está disponible');const deliveryType=o.deliveryType||'player_id';if(deliveryType==='account'||deliveryType==='account_code'){const secret=document.getElementById('buyAccountPassword');if(secret)secret.value='';toast('Compra no procesada: las entregas por cuenta necesitan backend seguro. No se guardó la contraseña ni se descontó saldo.');return}const g=gameById(o.gameId),pid=deliveryType==='player_id'?(document.getElementById('buyPlayerId')?.value.trim()||''):'',server=deliveryType==='player_id'?(document.getElementById('buyServer')?.value.trim()||''):'',recipientPhone=deliveryType==='code_phone'?(document.getElementById('buyRecipientPhone')?.value.trim()||''):'',code=document.getElementById('buyCoupon').value.trim(),coupon=code?couponFor(code):null;if(deliveryType==='player_id'&&!pid)return toast('Introduce el ID del jugador');if(deliveryType==='code_phone'&&!recipientPhone)return toast('Introduce el teléfono que recibirá el código');if(code&&!coupon)return toast('El cupón no es válido');const basePrice=effectiveSalePrice(o),amount=Number((basePrice*(1-(coupon?coupon.percent:0)/100)).toFixed(2));if(db.balance<amount){closeModal();toast('Saldo insuficiente. Recarga tu Wallet.');navigate('wallet');return}db.balance=Number((db.balance-amount).toFixed(2));const order={id:'RS-'+Date.now().toString().slice(-8),offerId:o.id,offerName:o.name,gameId:g.id,gameName:g.name,deliveryType,playerId:pid,server,recipientPhone,redemptionNote:o.redemptionNote||'',amount,originalAmount:basePrice,coupon:coupon?.code||'',status:'Pendiente',walletRefunded:false,date:new Date().toLocaleString('es-ES')};db.orders.unshift(order);db.ledger.unshift({ts:Date.now(),date:order.date,description:`Compra: ${g.name} / ${o.name}`,type:'Débito',amount:-amount,balanceAfter:db.balance});persist();closeModal();toast('Pedido creado · revisa el estado en Mis pedidos');n function localValue(amount,methodId){const method=db.methods.find(m=>m.id===methodId);const unit=method?.unit||(method?.id==='sm'||methodId==='sm'?'sm':method?.id==='usdt'||methodId==='usdt'?'usdt':'cup');const rate=Number(db.rates[unit]||1),value=Number(amount||0)*rate;return {value:unit==='usdt'?Number(value.toFixed(4)):Math.round(value),unit:unit==='sm'?'SM':unit==='usdt'?'USDT':'CUP'}}

function editOffer(id,defaultGameId=null){const o=id?offerById(id):null;const gameSel=o?.gameId||defaultGameId||db.games.find(g=>g.active)?.id||db.games[0]?.id||'',costMode=o?.costMode||'direct',price=Number(o?.price??1),saleSM=Math.round(price*Number(db.rates.sm||1)),saleCUP=Math.round(price*Number(db.rates.cup||1)),enteredCost=costMode==='credit'?(Number(o?.providerCreditAmount??(Number(o?.cost??.7)*Number(db.rates.buyCreditFactor||1)))):Number(o?.cost??.7);modal(`<span class="eyebrow">CATÁLOGO · PRECIO Y RENTABILIDAD</span><h2>${o?'Editar oferta':'Crear oferta'}</h2><p class="modal-sub">El USD se introduce manualmente. CUP y SM se calculan automáticamente según las tasas. El precio USDT es manual e independiente para cada oferta.</p><form onsubmit="saveOffer(event,${o?`'${o.id}'`:'null'})"><label class="field"><span>Juego</span><select id="ofGame">${db.games.map(g=>`<option value="${g.id}" ${gameSel===g.id?'selected':''}>${esc(g.name)}${g.active?'':' (pausado)'}</option>`).join('')}</select></label><label class="field"><span>Nombre del paquete / oferta</span><input id="ofName" required value="${esc(o?.name||'')}"></label><label class="field"><span>Descripción breve</span><input id="ofDesc" value="${esc(o?.description||'')}" maxlength="120"></label><section class="panel" style="padding:15px;margin:14px 0"><h3 style="margin-bottom:10px">1 · Tipo de entrega</h3><label class="field"><span>¿Cómo se entrega esta oferta?</span><select id="ofDeliveryType" onchange="updateDeliveryFormHint()"><option value="player_id" ${(o?.deliveryType||'player_id')==='player_id'?'selected':''}>Recarga normal por ID de jugador</option><option value="code_phone" ${o?.deliveryType==='code_phone'?'selected':''}>Código enviado a un teléfono</option><option value="account" ${o?.deliveryType==='account'?'selected':''}>Por cuenta: correo/usuario y contraseña</option><option value="account_code" ${o?.deliveryType==='account_code'?'selected':''}>Por cuenta + código interno</option></select></label><label class="field"><span>Instrucciones para el cliente</span><textarea id="ofRedemptionNote" rows="3" maxlength="500" placeholder="Ej. Canjea el código en la tienda oficial, sección Canjear.">${esc(o?.redemptionNote||'')}</textarea><small>En productos de código, indica dónde y cómo se canjea.</small></label><div id="deliveryTypeHint" class="notice">${deliveryTypeHintHTML(o?.deliveryType||'player_id')}</div></section><section class="panel" style="padding:15px;margin:14px 0"><h3 style="margin-bottom:10px">2 · Precio de venta al cliente</h3><div class="form-grid"><label class="field"><span>Precio manual en la web (USD)</span><input id="ofPrice" type="number" min="0.01" step="0.01" required value="${Math.max(.01,price).toFixed(2)}" oninput="syncOfferSaleFromUSD()" onchange="syncOfferSaleFromUSD()"><small>Se guarda en USD con hasta 2 decimales. Ejemplo: 0.67.</small></label><label class="field"><span>Equivalente calculado (SM)</span><input id="ofSaleSM" type="number" readonly value="${saleSM}"><small>USD × tasa SM, redondeado a entero.</small></label><label class="field"><span>Equivalente calculado (CUP)</span><input id="ofSaleCUP" type="number" readonly value="${saleCUP}"><small>USD × tasa CUP, redondeado a entero.</small></label><label class="field"><span>Precio USDT manual (opcional)</span><input id="ofUsdt" type="number" min="0.0001" step="0.0001" value="${Number(o?.usdtPrice)>0?o.usdtPrice:''}" placeholder="Ej. 0.73" oninput="updateOfferMarginPreview()"><small>No se calcula desde una tasa. Si lo dejas vacío, aparecerá “USDT sin definir”.</small></label></div><div class="notice">Tasas actuales: 1 USD = ${num(db.rates.sm)} SM y ${num(db.rates.cup)} CUP. El cambio de tasas actualiza estas equivalencias, nunca el precio USD manual.</div></section><section class="panel" style="padding:15px;margin:14px 0"><h3 style="margin-bottom:10px">3 · Coste de compra del proveedor</h3><label class="field"><span>Forma de calcular el coste</span><select id="ofCostMode" onchange="updateOfferCostMode(true)"><option value="direct" ${costMode==='direct'?'selected':''}>Introducir coste real en USD</option><option value="credit" ${costMode==='credit'?'selected':''}>Calcular desde el saldo nominal del proveedor</option></select></label><label class="field"><span id="ofCostLabel">${costMode==='credit'?'Consumo nominal de saldo del proveedor':'Coste directo del proveedor (USD)'}</span><input id="ofCost" data-mode="${costMode}" type="number" min="0" step="0.0001" value="${Number(enteredCost).toFixed(4)}" required oninput="updateOfferMarginPreview()"><small id="ofCostHelp">${costMode==='credit'?`El coste real se calcula dividiendo este saldo entre el factor de compra (${num(db.rates.buyCreditFactor||1)}).`:'Escribe lo que pagas realmente por esta recarga, en USD.'}</small></label><div class="notice">Factor actual de compra: ${num(db.rates.buyCreditFactor||1)} de saldo nominal por cada USD pagado.</div></section><label class="field"><input id="ofFeatured" type="checkbox" ${o?.featured?'checked':''} style="width:auto;margin-right:7px"> Mostrar como oferta destacada</label><div id="offerMarginPreview" class="margin-preview"></div><button class="btn btn-primary" type="submit">Guardar oferta</button></form>`);updateOfferCostMode(false);updateDeliveryFormHint();syncOfferSaleFromUSD();updateOfferMarginPreview()}
function updateOfferMarginPreview(){const el=document.getElementById('offerMarginPreview');if(!el)return;const raw=offerInputSaleUSD(),price=Number.isFinite(raw)&&raw>0?Number(raw.toFixed(2)):.01,cost=offerInputCostUSD(),profit=price-cost,pct=price>0?profit/price*100:0,saleSM=Math.round(price*Number(db.rates.sm||1)),saleCUP=Math.round(price*Number(db.rates.cup||1)),usdtManual=Number(document.getElementById('ofUsdt')?.value||0),creditMode=(document.getElementById('ofCostMode')?.value||'direct')==='credit';el.innerHTML=`<div class="margin-title">Resultado estimado por cada venta</div><div class="margin-number"><strong class="${profit<0?'loss':''}">${cash(profit)}</strong><span class="muted">margen bruto · ${num(pct)}%</span></div><div class="margin-details"><span>Venta web: ${cash(price)} USD</span><span>Coste real: ${cash(cost)} USD</span><span>Precio local: ${numWhole(saleSM)} SM</span><span>${numWhole(saleCUP)} CUP</span><span>${usdtManual>0?`${num(usdtManual)} USDT · manual`:'USDT sin definir'}</span>${creditMode?`<span>Consumo proveedor: ${num(Number(document.getElementById('ofCost')?.value||0))}</span>`:''}</div>${profit<0?'<div class="margin-warning">⚠ Estás vendiendo por debajo del coste. Cada venta genera una pérdida antes de gastos.</div>':profit===0?'<div class="margin-warning">El precio solo cubre el coste del proveedor; no deja margen para comisiones ni gastos.</div>':'<div class="muted" style="font-size:10px;margin-top:9px">Margen bruto antes de comisiones, variaciones de tasa, devoluciones y otros gastos.</div>'}`}
