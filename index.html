function getRegistrationDraft(){

const ref=document.getElementById('regReferral')?.value.trim().toUpperCase()||'';

if(db.users.some(x=>normalizePhone(x.phone)===normalizePhone(phoneE164))){toast('Ya existe una cuenta con ese número en este navegador. Inicia sesión.');return null}
if(!/^\d{6}$/.test(pin)){toast('El PIN debe tener 6 dígitos');return null}

// Linking rewards across devices requires a shared authenticated backend.
const inviter=ref?db.users.find(x=>String(x.referralCode||'').toUpperCase()===ref&&x.active!==false)||null:null;
return {name,phoneRaw,phoneE164,pin,ref,whatsappNotifications,inviter,invitedByCode:ref||''};
}

escription||'')}</small></td><td>${o.coinCost} RC</td><td>${o.type==='wallet'?cash(o.value)+' Wallet':Number(o.value)+'% cupón'}</td><td>${statusBadge(o.active?'Completado':'Pausado')}</td><td><div class="admin-action-row"><button class="filter-chip" onclick="editSpecialOffer('${o.id}')">Editar</button><button class="filter-chip" onclick="toggleSpecialOffer('${o.id}')">${o.active?'Pausar':'Activar'}</button><button class="filter-chip danger-chip" onclick="deleteSpecialOffer('${o.id}')">Eliminar</button></div></td></tr>`).join('')}</tbody></table></div></section>`}
function editSpecialOffer(id){const o=id?db.specialOffers.find(x=>x.id===id):null;modal(`<span class="eyebrow">RECOMPENSA DE PUNTOS</span><h2>${o?'Editar recompensa':'Crear recompensa'}</h2><form onsubmit="saveSpecialOffer(event,${o?`'${o.id}'`:'null'})"><label class="field"><span>Nombre visible</span><input id="spName" maxlength="70" required value="${esc(o?.name||'')}"></label><label class="field"><span>Descripción</span><textarea id="spDesc" maxlength="180">${esc(o?.description||'')}</textarea></label><div class="form-grid"><label class="field"><span>Coste en RefillCoins</span><input id="spCost" type="number" min="1" step="1" required value="${o?.coinCost??50}"></label><label class="field"><span>Tipo de premio</span><select id="spType"><option value="wallet" ${o?.type!=='coupon'?'selected':''}>Crédito Wallet (USD)</option><option value="coupon" ${o?.type==='coupon'?'selected':''}>Cupón de descuento (%)</option></select></label></div><label class="field"><span>Valor (USD o porcentaje, según tipo)</span><input id="spValue" type="number" min="0.01" step="0.01" required value="${o?.value??0.5}"></label><button class="btn btn-primary" type="submit">Guardar recompensa</button></form>`)}
function saveSpecialOffer(e,id){e.preventDefault();const data={name:document.getElementById('spName').value.trim(),description:document.getElementById('spDesc').value.trim(),coinCost:Math.floor(Number(document.getElementById('spCost').value)),type:document.getElementById('spType').value,value:Number(document.getElementById('spValue').value),active:id?Boolean(db.specialOffers.find(x=>x.id===id)?.active):true};if(!data.name||data.coinCost<1||!Number.isFinite(data.value)||data.value<=0||(data.type==='coupon'&&data.value>80))return toast('Comprueba los datos de la recompensa');if(id)Object.assign(db.specialOffers.find(x=>x.id===id),data);else db.specialOffers.push({id:'special-'+Date.now(),...data});persist();closeModal();render();toast('Recompensa guardada')}

function adminUsers(){return `<div class="section-head"><div><h2>Cuentas registradas</h2><p>Vista local de los usuarios creados en este navegador. Nunca se muestra el PIN.</p></div><span class="coupon-badge">${db.users.length} cuentas</span></div><section class="panel">${db.users.length?`<div class="table-scroll"><table class="list-table"><thead><tr><th>USUARIO</th><th>TELÉFONO / WHATSAPP</th><th>INVITACIÓN</th><th>GASTO ACUMULADO</th><th>REFILLCOINS</th><th>ESTADO</th><th>ACCIONES</th></tr></thead><tbody>${db.users.map(u=>`<tr><td><b>${esc(u.name)}</b><br><small class="muted">${esc(u.createdAt||'')}</small></td><td>${esc(u.phone)}<br><span class="wa-status ${u.phoneVerified?'verified':'unverified'}">${u.phoneVerified?'Verificado':'No verificado'}</span><br><small class="muted">Avisos: ${u.whatsappNotifications?'sí':'no'}</small></td><td>${esc(u.referralCode)}<br><small class="muted">${db.users.filter(x=>x.invitedBy===u.id).length} amigos</small></td><td>${cash(u.id===db.sessionUserId?db.eligibleSpend:u.eligibleSpend||0)}</td><td><b>${coinsForAccount(u)} RC</b></td><td>${statusBadge(u.active===false?'Rechazado':'Completado')}</td><td><div class="admin-action-row"><button class="filter-chip" onclick="adminAdjustCoins('${u.id}')">Ajustar RC</button><button class="filter-chip" onclick="adminToggleUser('${u.id}')">${u.active===false?'Activar':'Desactivar'}</button></div></td></tr>`).join('')}</tbody></table></div>`:empty('♙','Todavía no hay cuentas registradas en este navegador.')}</section><p class="security-note">Para que todos los usuarios vean sus cuentas desde cualquier teléfono o PC, hay que conectar Auth + base de datos remota. Esta tabla es solamente la demo local.</p>`}
function adminAdjustCoins(id){const u=db.users.find(x=>x.id===id);if(!u)return;const amount=Number(prompt('Cantidad de RefillCoins que se sumarán o restarán. Ejemplo: 5 o -3','5'));if(!Number.isInteger(amount)||!amount)return toast('Introduce un entero distinto de cero');const currentBalance=coinsForAccount(u);if(currentBalance+amount<0)return toast('El saldo no puede quedar negativo');if(id===db.sessionUserId){addCoinLedger(amount,'Ajuste administrativo','admin-adjust-'+Date.now())}else{u.coins=Math.max(0,Number(u.coins||0)+amount);u.coinLedger=u.coinLedger||[];u.coinLedger.unshift({id:'RC-'+Date.now(),date:new Date().toLocaleString('es-ES'),description:'Ajuste administrativo',amount,balanceAfter:u.coins})}persist();render();toast('Saldo de RefillCoins ajustado')}
function adminToggleUser(id){const u=db.users.find(x=>x.id===id);if(!u)return;u.active=u.active===false?true:false;persist();render();toast(u.active?'Cuenta activada':'Cuenta desactivada')}
function allOwnedOrders(){const out=[];for(const u of db.users){const arr=u.id===db.sessionUserId?db.orders:(u.orders||[]);for(const o of arr)out.push({order:o,user:u})}return out}
function allOwnedDeposits(){const out=[];for(const u of db.users){const arr=u.id===db.sessionUserId?db.deposits:(u.deposits||[]);for(const d of arr)out.push({deposit:d,user:u})}return out}
function findOrderOwner(orderId){for(const pair of allOwnedOrders())if(pair.order.id===orderId)return pair;return null}
function findDepositOwner(depositId){for(const pair of allOwnedDeposits())if(pair.deposit.id===depositId)return pair;return null}
function completeOrderRewards(user,order,isCurrent){const amount=Math.max(0,Number(order.amount)||0),before=isCurrent?Number(db.eligibleSpend||0):Number(user.eligibleSpend||0),after=Number((before+amount).toFixed(2));if(isCurrent)db.eligibleSpend=after;else user.eligibleSpend=after;const rate=Math.max(1,Math.floor(Number(db.loyalty.coinsPerUsd)||1)),earned=(Math.floor(after)*rate)-(Math.floor(before)*rate);if(earned>0)grantCoinsToUser(user.id,earned,'Compra completada: '+order.offerName,order.id);order.coinsAwarded=earned;const referralPaid=isCurrent?db.referralRewardPaid:Boolean(user.referralRewardPaid);if(user.invitedBy&&!referralPaid&&after>=Number(db.loyalty.referralMinSpend||0)){if(isCurrent)db.referralRewardPaid=true;else user.referralRewardPaid=true;grantCoinsToUser(user.id,Number(db.loyalty.referralFriendCoins)||0,'Recompensa por invitación: primera meta completada', 'referral-friend-'+user.id);grantCoinsToUser(user.invitedBy,Number(db.loyalty.referralInviterCoins)||0,'Tu amigo completó su meta de invitación','referral-inviter-'+user.id)}}

function offerById(id){return db.offers.find(o=>o.id===id)}

function productEquiv(price,offer=null){const effective=offer?effectiveSalePrice(offer):Math.max(.01,Number((Number(price)||.01).toFixed(2)));const sm=Math.round(effective*Number(db.rates.sm||1));const cup=Math.round(effective*Number(db.rates.cup||1));const manual=offer&&Number(offer.usdtPrice)>0?Number(offer.usdtPrice):null;return {cup,sm,usdt:manual}}

function navigate(route){
if(route==='admin'){location.hash='admin';return}
const protectedRoute=String(route||'').split('/')[0];
if(['wallet','pedidos','movimientos','refillcoins','ruleta'].includes(protectedRoute)&&!currentUser()){
  toast('Crea una cuenta o inicia sesión para continuar.');
  location.hash='cuenta';

function render(){const parts=routeParts(),route=parts[0]||'inicio';syncNav(route);const view=document.getElementById('view');if(!view)return;const labels={inicio:'Inicio',juegos:'Todos los juegos',ofertas:'Ofertas',wallet:'Mi Wallet',pedidos:'Mis pedidos',movimientos:'Movimientos',ayuda:'Centro de ayuda',admin:'Administración',cuenta:'Mi cuenta',refillcoins:'RefillCoins',ruleta:'Ruleta de premios',especiales:'Ofertas especiales'};document.getElementById('pageCrumb').textContent=route==='game'?(gameById(parts[1])?.name||'Juego'):labels[route]||'REFILLS SHOP';if(db.settings.maintenance&&route!=='admin'){view.innerHTML=maintenanceView();return}if(route==='inicio')view.innerHTML=homeView();else if(route==='juegos')view.innerHTML=gamesView();else if(route==='ofertas')view.innerHTML=offersView();else if(route==='game')view.innerHTML=gameView(parts[1]);else if(route==='wallet')view.innerHTML=walletView();else if(route==='pedidos')view.innerHTML=ordersView();else if(route==='movimientos')view.innerHTML=ledgerView();else if(route==='ayuda')view.innerHTML=helpView();else if(route==='cuenta')view.innerHTML=accountView();else if(route==='refillcoins')view.innerHTML=refillcoinsView();else if(route==='ruleta')view.innerHTML=rouletteView();else if(route==='especiales')view.innerHTML=specialOffersView();else if(route==='admin')view.innerHTML=adminView();else view.innerHTML=homeView();}

function adminView(){if(!adminAuthed)return `<section class="login-card"><div class="brand"><span class="brand-mark">R</span><span><span class="brand-name">REFILLS <span>SHOP</span></span><small class="brand-sub">CONSOLA PRIVADA</small></span></div><span class="eyebrow">ZONA RESTRINGIDA</span><h1>Administración de la plataforma</h1><p>Inicia sesión para administrar catálogo, tasas, solicitudes, pedidos y configuración.</p><form onsubmit="adminLogin(event)"><label class="field"><span>Contraseña administrativa</span><input id="adminPassword" type="password" placeholder="Introduce la contraseña privada del servidor" autocomplete="current-password" required></label><button class="btn btn-primary" type="submit">Entrar al panel ↗</button></form><p class="muted" style="font-size:10px;margin-top:18px">La sincronización entre dispositivos necesita una contraseña validada por el servidor. El acceso local de demostración no puede guardar cambios compartidos.</p></section>`;const tabs=[['dashboard','◈','Resumen'],['offers','▦','Ofertas'],['liogames','🔌','LioGames API'],['games','🎮','Juegos'],['rates','💱','Tasas'],['deposits','⇧','Depósitos'],['orders','▤','Pedidos'],['methods','💳','Métodos de pago'],['coupons','％','Cupones'],['loyalty','💠','RefillCoins'],['users','♙','Usuarios'],['settings','⚙','Configuración']];return `<div class="page-head-row"><div><span class="eyebrow">CENTRO DE CONTROL</span><h1 class="page-title">Administración</h1><p class="page-desc">Los ajustes de tienda se sincronizan por Supabase; datos de clientes y pedidos aún requieren su propia integración.</p></div><button class="btn btn-secondary btn-small" onclick="adminLogout()">Cerrar sesión ↗</button></div>${adminSyncPanelHTML()}<div class="admin-shell"><nav class="admin-nav">${tabs.map(t=>`<button class="${adminTab===t[0]?'active':''}" onclick="adminTab='${t[0]}';render()">${t[1]} &nbsp; ${t[2]}</button>`).join('')}</nav><div class="admin-content">${adminTab==='dashboard'?adminDashboard():adminTab==='offer function adminOffers(){const margin=db.offers.length?db.offers.reduce((n,o)=>n+effectiveSalePrice(o)-Number(o.cost||0),0)/db.offers.length:0;const gameSections=db.games.map((g,gameIndex)=>{const offers=db.offers.filter(o=>o.gameId===g.id);return `<section class="panel subsection"><div class="section-head" style="margin-top:0"><div><h2>${esc(g.icon||'🎮')} ${esc(g.name)}</h2><p>${offers.length} ofertas · ${offers.filter(o=>o.active).length} activas · ${g.active?'Juego visible':'Juego pausado'}</p></div><div class="admin-action-row"><button class="filter-chip" title="Subir juego" onclick="moveGame('${g.id}',-1)" ${gameIndex===0?'disabled':''}>↑ Juego</button><button class="filter-chip" title="Bajar juego" onclick="moveGame('${g.id}',1)" ${gameIndex===db.games.length-1?'disabled':''}>↓ Juego</button><button class="btn btn-primary btn-small" onclick="editOffer(null,'${g.id}')">＋ Oferta para ${esc(g.name)}</button></div></div>${offers.length?`<div class="table-scroll"><table class="list-table"><thead><tr><th>ORDEN</th><th>OFERTA / ENTREGA</th><th>COSTE REAL</th><th>PRECIO WEB</th><th>VENTA EN SM</th><th>USDT</th><th>GANANCIA BRUTA</th><th>ESTADO</th><th>ACCIONES</th></tr></thead><tbody>${offers.map((o,offerIndex)=>{const eq=productEquiv(effectiveSalePrice(o),o),profit=effectiveSalePrice(o)-Number(o.cost);return `<tr><td><div class="admin-action-row"><button class="filter-chip" title="Subir oferta" onclick="moveOffer('${o.id}',-1)" ${offerIndex===0?'disabled':''}>↑</button><button class="filter-chip" title="Bajar oferta" onclick="moveOffer('${o.id}',1)" ${offerIndex===offers.length-1?'disabled':''}>↓</button></div><span class="muted">${offerIndex+1}</span></td><td><b>${esc(o.name)}</b><br><span class="muted">${esc(o.description||'')}${o.featured?' · Destacada':''}</span><br><span class="coupon-badge">${esc(deliveryTypeLabel(o.deliveryType))}</span>${o.redemptionNote?`<br><span class="muted">Nota: ${esc(o.redemptionNote)}</span>`:''}</td><td><b>${cash(o.cost)}</b><br><span function adminLioGames(){const c=lioGetPublicConfig(),maps=lioGetMappings();return `<div class="section-head"><div><span class="eyebrow">INTEGRACIÓN DE PROVEEDOR</span><h2>Distribution Hub · LioGames</h2><p>Fase 1: leer catálogo, variaciones, requisitos y precios publicados. Esta pantalla no crea pedidos con dinero real.</p></div><span class="coupon-badge">${Object.keys(maps).length} vinculaciones locales</span></div><div class="danger-note"><b>Modo seguro:</b> el catálogo público se puede consultar aquí. El saldo del proveedor y los pedidos Sandbox necesitarán autenticar al administrador con Supabase y configurar los secretos del backend. Nunca pegues el secreto HMAC de LioGames en esta página.</div><section class="panel subsection"><h3>1 · Conectar con la función de Supabase</h3><p class="muted">Primero debes desplegar <code>liogames-gateway</code> siguiendo el README. Introduce únicamente la Project URL base (por ejemplo https://abcdefgh.supabase.co, sin rutas) y la clave pública (publishable/anon). No uses el enlace del Dashboard ni el secreto del proveedor.</p><form onsubmit="saveLioPublicConfig(event)"><div class="form-grid"><label class="field"><span>Supabase Project URL</span><input id="lioSupabaseUrl" type="url" placeholder="https://TU-PROYECTO.supabase.co" value="${esc(c.url||'')}" required></label><label class="field"><span>Clave pública (publishable / anon)</span><input id="lioSupabasePublicKey" type="password" autocomplete="off" placeholder="sb_publishable_… o clave anon" value="${esc(c.publicKey||'')}" required><small>Solo clave pública. No introduzcas service_role ni el secreto de LioGames.</small></label></div><div class="admin-action-row"><button class="btn btn-primary" type="submit">Guardar conexión</button><button class="btn btn-secondary" type="button" onclick="lioTestConnection()">Probar API y catálogo</button></div></form><div id="lioConnectionStatus" class="notice" style="margin-top:14px">${c.url&&c.publicKey?'Configuración local guardada. Pulsa “Probar API y catálogo”.':'Configura la URL y la clave pública cuando la función esté desplegada.'}</div></section><section class="panel subsection"><div class="section-head" style="margin-top:0"><div><h3>2 · Catálogo de LioGames</h3><p>Obtén los IDs reales de productos y paquetes para vincularlos con las ofertas de REFILLS SHOP.</p></div><button type="button" class="btn btn-primary btn-small" onclick="lioLoadProducts()">↻ Cargar productos</button></div><div class="toolbar" style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px"><input id="lioProductSearch" class="search-input" style="min-width:220px;flex:1" placeholder="Buscar juego o ID del proveedor…" oninput="lioFilterProducts()"><span id="lioProductCount" class="coupon-badge">Catálogo sin cargar</span></div><div id="lioProductsResults"><div class="empty">Pulsa “Cargar productos” para consultar el catálogo oficial.</div></div><div id="lioDetailsResults" style="margin-top:16px"></div></section><section class="panel subsection"><h3>3 · Próximo paso: probar Sandbox</h3><p>Una vez confirmado el catálogo, configuraremos la autenticación administrativa, los secretos HMAC, consulta de saldo y pedidos de Sandbox. No habilitaremos pedidos reales hasta verificar correctamente el flujo completo, el coste y la protección contra pedidos duplicados.</p><div class="filter-row"><span class="filter-chip">1. Catálogo</span><span class="filter-chip">2. Variación exacta</span><span class="filter-chip">3. Esquema de campos</span><span class="filter-chip">4. Precio proveedor</span><span class="filter-chip">5. Sandbox</span></div><p class="muted" style="font-size:11px">Documentación oficial: <a href="https://distribution.liogames.com/developers/" target="_blank" rel="noopener">distribution.liogames.com/developers</a></p></section>`}
function saveLioPublicConfig(e){e.preventDefault();const rawUrl=document.getElementById('lioSupabaseUrl').value.trim();const publicKey=document.getElementById('lioSupabasePublicKey').value.trim();let url;try{const u=new URL(rawUrl);if(u.protocol!=='https:'&&u.hostname!=='localhost')throw new Error('La URL debe usar HTTPS.');if(u.pathname!=='/'||u.search||u.hash)throw new Error('Pega solo la Project URL base, sin /functions/v1, sin el nombre de la función y sin el enlace del Dashboard.');url=u.origin;}catch(err){return toast(err.message||'Introduce una URL de Supabase válida.')}if(publicKey.length<20)return toast('La clave pública parece incompleta.');localStorage.setItem('REFILLS_LIO_PUBLIC_CONFIG',JSON.stringify({url,publicKey}));render();toast('Conexión guardada en este navegador. Para otros dispositivos, configura la clave pública en SUPABASE_ANON_KEY dentro del HTML y publica el cambio.');remoteConfigPromise=bootstrapRemoteConfig(true)}
async function lioCall(action,params={}){const c=lioGetPublicConfig();if(!c.url||!c.publicKey)throw new Error('Primero guarda la URL de Supabase y la clave pública.');let endpoint;try{const u=new URL(c.url);if(u.pathname!=='/'||u.search||u.hash)throw new Error('La Project URL debe ser solo el origen, por ejemplo https://abcdefgh.supabase.co, sin /functions/v1 ni enlaces del Dashboard.');endpoint=u.origin+'/functions/v1/liogames-gateway';}catch(err){throw new Error(err.message||'La URL de Supabase no es válida.')}let resp;try{resp=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json','apikey':c.publicKey,'Authorization':'Bearer '+c.publicKey},body:JSON.stringify({action,...params})})}catch(err){const detail=err&&err.message?err.message:String(err);throw new Error('El navegador no pudo completar la petición (red o CORS). Endpoint consultado: '+endpoint+'. Comprueba que exista una Edge Function publicada con el nombre exacto liogames-gateway en ese mismo proyecto. Detalle del navegador: '+detail)}const raw=await resp.text();let payload;try{payload=raw?JSON.parse(raw):{}}catch(e){throw new Error('Supabase respondió HTTP '+resp.status+' pero no devolvió JSON. Endpoint: '+endpoint+'. Respuesta inicial: '+raw.slice(0,180))}if(!resp.ok||payload.ok===false&&payload.error)throw new Error((payload.error||payload.message||payload.msg||('Error HTTP '+resp.status))+' (HTTP '+resp.status+'). Endpoint: '+endpoint);return payload}
function lioSetStatus(message,ok=false){const el=document.getElementById('lioConnectionStatus');if(el)el.innerHTML=`<b style="color:${ok?'#38d9a3':'#ffbd69'}">${ok?'✓ ':'! '}</b>${esc(message)}`}
async function lioTestConnection(){lioSetStatus('Probando conexión…');try{const ping=await lioCall('ping');const d=ping.data||ping;const message=d.message||d.data?.message||'La API respondió correctamente.';lioSetStatus('Edge Function conectada. LioGames: '+message,true);await lioLoadProducts(false)}catch(e){lioSetStatus(e.message);toast(e.message)}}
function lioExtractArray(value,depth=0){
  if(depth>9||value==null)return[];
  if(Array.isArray(value))return value;
  if(typeof value!=='object')return[];
  const keys=['products','product_list','productList','items','results','catalog','catalogue','records','rows','list','variations','data','result','response','payload'];
  for(const key of keys){
    if(value[key]!=null){
      const found=lioExtractArray(value[key],depth+1);
      if(found.length)return found;
    }
  }
  // Fallback for envelopes where the product array is under an undocumented key.
  for(const child of Object.values(value)){
    const found=lioExtractArray(child,depth+1);
    if(found.length && found.some(x=>x&&typeof x==='object'&&('product_id' in x||'productId' in x||'variation_id' in x)&&('name' in x||'product_name' in x||'title' in x||'variation_name' in x)))return found;
  }
  return[];
}
function lioFindId(p){const id=p?.product_id??p?.variation_id??p?.id??p?.productId??p?.variationId;return id==null?'':String(id)}

async function lioLoadProducts(showToast=true){
  const holder=document.getElementById('lioProductsResults');
  if(holder)holder.innerHTML='<div class="notice">Consultando catálogo de Distribution Hub…</div>';
  let primaryData=null, fallbackData=null, fallbackError='';
  try{
    const response=await lioCall('products');
    primaryData=response.data??response;
    let rows=lioExtractArray(primaryData);
    let source='API /products';
    if(!rows.length){
      try{
        const fallback=await lioCall('catalog-json');
        fallbackData=fallback.data??fallback;
        const fallbackRows=lioExtractArray(fallbackData);
        if(fallbackRows.length){rows=fallbackRows;source='/catalog.json';}
      }catch(e){fallbackError=e&&e.message?e.message:String(e);}
    }
    window.__lioProductCache=rows;
    if(holder&&rows.length===0){
      holder.innerHTML=`<div class="notice">La conexión responde, pero todavía no se pudo extraer una lista de productos. Abajo están las respuestas para identificar su formato.</div><h4 style="margin:14px 0 6px">Respuesta de /products</h4><pre class="lio-json">${esc(JSON.stringify(primaryData,null,2))}</pre>${fallbackData!==null?`<h4 style="margin:14px 0 6px">Respuesta de /catalog.json</h4><pre class="lio-json">${esc(JSON.stringify(fallbackData,null,2))}</pre>`:''}${fallbackError?`<div class="notice">El catálogo alternativo no respondió: ${esc(fallbackError)}</div>`:''}`;
    }else lioRenderProducts(rows);
    const c=document.getElementById('lioProductCount');
    if(c)c.textContent=rows.length+' productos';
    if(rows.length){lioSetStatus(`Catálogo cargado desde ${source}: ${rows.length} productos.`,true);if(showToast)toast(`Catálogo cargado: ${rows.length} productos.`);}
    else {lioSetStatus('Conexión confirmada, pero no se detectaron productos. Revisa las respuestas JSON mostradas debajo del catálogo.',false);if(showToast)toast('La conexión funciona, pero no se detectó la lista de productos.');}
  }catch(e){if(holder)holder.innerHTML=`<div class="empty">${esc(e.message)}</div>`;lioSetStatus(e.message);if(showToast)toast(e.message)}
}
function lioRenderProducts(rows){const holder=document.getElementById('lioProductsResults');if(!holder)return;const q=(document.getElementById('lioProductSearch')?.value||'').trim().toLowerCase();const list=(rows||[]).filter(p=>(lioProductLabel(p)+' '+lioFindId(p)+' '+(p.category||p.game||p.description||'')).toLowerCase().includes(q)).slice(0,100);holder.innerHTML=list.map(p=>{const id=lioFindId(p);const req=p.order_requirements||p.requirements||{};const required=Array.isArray(req.required_fields)?req.required_fields.join(', '):'';const category=p.category||p.game||p.type||'Juego / producto';const safeId=/^\d+$/.test(id)?id:'';return `<article class="panel subsection" style="margin-bottom:12px"><div class="page-head-row" style="margin-bottom:8px"><div><span class="eyebrow">${esc(category)}</span><h3 style="margin:5px 0">${esc(lioProductLabel(p))}</h3><p class="muted" style="font-size:11px">Product ID: <b>${esc(id||'No indicado')}</b>${required?' · Campos: '+esc(required):''}</p></div><span class="coupon-badge">${p.active===false?'Inactivo':'Proveedor'}</span></div><div class="admin-action-row">${safeId?`<button class="btn btn-secondary btn-small" onclick="lioLoadVariations('${safeId}')">Ver paquetes / variaciones</button><button class="btn btn-secondary btn-small" onclick="lioLoadSchema('${safeId}','')">Ver requisitos</button><button class="btn btn-secondary btn-small" onclick="lioLoadPriceMatrix('${safeId}')">Precios proveedor</button>`:'<span class="muted">El ID no tiene formato numérico y no puede consultarse automáticamente.</span>'}</div></article>`}).join('')||'<div class="empty">No hay productos que coincidan con la búsqueda.</div>'}

function getSharedStoreConfig(){const out={};for(const key of SHARED_CONFIG_KEYS){if(db[key]!==undefined)out[key]=structuredClone(db[key])}try{out.lioMappings=JSON.parse(localStorage.getItem('REFILLS_LIO_LOCAL_MAPPINGS')||'{}')}catch{out.lioMappings={}}return out}

><label class="field"><span>Instrucciones para el cliente</span><textarea id="ofRedemptionNote" rows="3" maxlength="500" placeholder="Ej. Canjea el código en la tienda oficial, sección Canjear.">${esc(o?.redemptionNote||'')}</textarea><small>En productos de código, indica dónde y cómo se canjea.</small></label><div id="deliveryTypeHint" class="notice">${deliveryTypeHintHTML(o?.deliveryType||'player_id')}</div></section><section class="panel" style="padding:15px;margin:14px 0"><h3 style="margin-bottom:10px">2 · Precio de venta al cliente</h3><div class="form-grid"><label class="field"><span>Precio manual en la web (USD)</span><input id="ofPrice" type="number" min="0.01" step="0.01" required value="${Math.max(.01,price).toFixed(2)}" oninput="syncOfferSaleFromUSD()" onchange="syncOfferSaleFromUSD()"><small>Se guarda en USD con hasta 2 decimales. Ejemplo: 0.67.</small></label><label class="field"><span>Equivalente calculado (SM)</span><input id="ofSaleSM" type="number" readonly value="${saleSM}"><small>USD × tasa SM, redondeado a entero.</small></label><label class="field"><span>Equivalente calculado (CUP)</span><input id="ofSaleCUP" type="number" readonly value="${saleCUP}"><small>USD × tasa CUP, redondeado a entero.</small></label><label class="field"><span>Precio USDT manual (opcional)</span><input id="ofUsdt" type="number" min="0.0001" step="0.0001" value="${Number(o?.usdtPrice)>0?o.usdtPrice:''}" placeholder="Ej. 0.73" oninput="updateOfferMarginPreview()"><small>No se calcula desde una tasa. Si lo dejas vacío, aparecerá “USDT sin definir”.</small></label></div><div class="notice">Tasas actuales: 1 USD = ${num(db.rates.sm)} SM y ${num(db.rates.cup)} CUP. El cambio de tasas actualiza estas equivalencias, nunca el precio USD manual.</div></section><section class="panel" style="padding:15px;margin:14px 0"><h3 style="margin-bottom:10px">3 · Coste de compra del proveedor</h3><label class="field"><span>Forma de calcular el coste</span><select id="ofCostMode" onchange="updateOfferCostMode(true)"><option value="direct" ${costMode==='direct'?'selected':''}>Introducir coste real en USD</option><option value="credit" ${costMode==='credit'?'selected':''}>Calcular desde el saldo nominal del proveedor</option></select></label><label class="field"><span id="ofCostLabel">${costMode==='credit'?'Consumo nominal de saldo del proveedor':'Coste directo del proveedor (USD)'}</span><input id="ofCost" data-mode="${costMode}" type="number" min="0" step="0.0001" value="${Number(enteredCost).toFixed(4)}" required oninput="updateOfferMarginPreview()"><small id="ofCostHelp">${costMode==='credit'?`El coste real se calcula dividiendo este saldo entre el factor de compra (${num(db.rates.buyCreditFactor||1)}).`:'Escribe lo que pagas realmente por esta recarga, en USD.'}</small></label><div class="notice">Factor actual de compra: ${num(db.rates.buyCreditFactor||1)} de saldo nominal por cada USD pagado.</div></section><label class="field"><input id="ofFeatured" type="checkbox" ${o?.featured?'checked':''} style="width:auto;margin-right:7px"> Mostrar como oferta destacada</label><div id="offerMarginPreview" class="margin-preview"></div><button class="btn btn-primary" type="submit">Guardar oferta</button></form>`);updateOfferCostMode(false);updateDeliveryFormHint();syncOfferSaleFromUSD();updateOfferMarginPreview()}
function updateOfferMarginPreview(){const el=document.getElementById('offerMarginPreview');if(!el)return;const raw=offerInputSaleUSD(),price=Number.isFinite(raw)&&raw>0?Number(raw.toFixed(2)):.01,cost=offerInputCostUSD(),profit=price-cost,pct=price>0?profit/price*100:0,saleSM=Math.round(price*Number(db.rates.sm||1)),saleCUP=Math.round(price*Number(db.rates.cup||1)),usdtManual=Number(document.getElementById('ofUsdt')?.value||0),creditMode=(document.getElementById('ofCostMode')?.value||'direct')==='credit';el.innerHTML=`<div class="margin-title">Resultado estimado por cada venta</div><div class="margin-number"><strong class="${profit<0?'loss':''}">${cash(profit)}</strong><span class="muted">margen bruto · ${num(pct)}%</span></div><div class="margin-details"><span>Venta web: ${cash(price)} USD</span><span>Coste real: ${cash(cost)} USD</span><span>Precio local: ${numWhole(saleSM)} SM</span><span>${numWhole(saleCUP)} CUP</span><span>${usdtManual>0?`${num(usdtManual)} USDT · manual`:'USDT sin definir'}</span>${creditMode?`<span>Consumo proveedor: ${num(Number(document.getElementById('ofCost')?.value||0))}</span>`:''}</div>${profit<0?'<div class="margin-warning">⚠ Estás vendiendo por debajo del coste. Cada venta genera una pérdida antes de gastos.</div>':profit===0?'<div class="margin-warning">El precio solo cubre el coste del proveedor; no deja margen para comisiones ni gastos.</div>':'<div class="muted" style="font-size:10px;margin-top:9px">Margen bruto antes de comisiones, variaciones de tasa, devoluciones y otros gastos.</div>'}`}
