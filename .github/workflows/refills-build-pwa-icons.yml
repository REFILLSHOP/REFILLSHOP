name: Generar iconos oficiales Refills Shop
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refills-build-pwa-icons.yml"
      - "scripts/build_pwa_icons.py"
      - "assets/refills-icon.png"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install Pillow==11.3.0
      - run: python scripts/build_pwa_icons.py
      - name: Guardar los iconos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/refills-app-192.png assets/refills-app-512.png assets/refills-app-maskable-512.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Generar iconos PWA con el logo oficial de Refills Shop"
          git push
