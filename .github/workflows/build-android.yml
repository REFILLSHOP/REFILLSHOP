name: Refills Shop Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        run: |
          test -n "$ANDROID_HOME"
          if [[ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" || ! -x "$ANDROID_HOME/build-tools/35.0.0/aapt2" ]]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
            test -x "$SDKMANAGER"
            "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
          fi
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Add official Refills Shop brand icon
        run: mkdir -p android/app/src/main/res/drawable && cp assets/refills-icon.png android/app/src/main/res/drawable/refills_brand.png
      - name: Build installable APK
        run: gradle -p android :app:assembleDebug --no-daemon
      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Refills-Shop-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish stable signed customer APK (requires signing secrets)
        if: github.ref == 'refs/heads/main'
        env:
          KEYSTORE_B64: ${{ secrets.REFILLS_ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.REFILLS_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.REFILLS_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.REFILLS_ANDROID_KEY_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_B64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "::notice::Production APK signing is not configured; only the test artifact was built."
            exit 0
          fi
          umask 077
          KEYSTORE=$(mktemp)
          trap 'rm -f "$KEYSTORE"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          gradle -p android :app:assembleRelease --no-daemon
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk /tmp/refills-aligned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$KEYSTORE" --ks-key-alias "$KEY_ALIAS" --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD --out Refills-Shop.apk /tmp/refills-aligned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify Refills-Shop.apk
          VERSION=$(sed -n 's/.*versionCode \([0-9]*\).*/\1/p' android/app/build.gradle | head -n 1)
          TAG="android-v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::This version already exists. Increase versionCode to publish an update."
          else
            gh release create "$TAG" Refills-Shop.apk --target "$GITHUB_SHA" --title "Refills Shop Android $VERSION" --notes "APK oficial de clientes firmada. Android solicita confirmación para instalar o actualizar."
          fi
