name: Refills Shop V10 checks

on:
  pull_request:
    paths:
      - "v10/**"
      - "edge/**"
      - ".github/workflows/refills-v10-tests.yml"
  push:
    branches:
      - "deploy/refills-v10-ready"
    paths:
      - "v10/**"
      - "edge/**"
      - ".github/workflows/refills-v10-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run tests
        run: npm test
