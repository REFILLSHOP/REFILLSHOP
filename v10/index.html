<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050d1d">
  <meta property="og:image" content="/assets/refills-icon.png">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Refills Shop · recargas para Cuba, catálogo, pedidos y revendedores.">
  <title>Refills Shop · Catálogo digital Cuba</title>
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="stylesheet" href="/site.css">
</head>
<body>
  <svg aria-hidden="true" style="width:0;height:0;position:absolute;overflow:hidden" xmlns="http://www.w3.org/2000/svg"><defs>
<symbol id="icon-bolt" viewbox="0 0 24 24"><path d="M13.6 1 4 13h7l-1 10L20 10h-7z" fill="currentColor"></path></symbol>
<symbol id="icon-game" viewbox="0 0 24 24"><rect fill="none" height="12" rx="5" stroke="currentColor" stroke-width="1.7" width="19" x="2.5" y="7"></rect><path d="M7 11v5M4.5 13.5h5" stroke="currentColor" stroke-linecap="round" stroke-width="1.7"></path><circle cx="16" cy="11.5" fill="currentColor" r="1"></circle><circle cx="18.5" cy="14.5" fill="currentColor" r="1"></circle></symbol>
<symbol id="icon-search" viewbox="0 0 24 24"><circle cx="10.8" cy="10.8" fill="none" r="6.8" stroke="currentColor" stroke-width="2"></circle><path d="m16 16 5 5" stroke="currentColor" stroke-linecap="round" stroke-width="2"></path></symbol>
<symbol id="icon-arrow" viewbox="0 0 24 24"><path d="M4 12h16m-6-6 6 6-6 6" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></symbol>
<symbol id="icon-check" viewbox="0 0 24 24"><path d="m4 12 5 5L20 6" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2"></path></symbol>
<symbol id="icon-x" viewbox="0 0 24 24"><path d="m5 5 14 14M19 5 5 19" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="2"></path></symbol>
<symbol id="icon-bag" viewbox="0 0 24 24"><rect fill="none" height="14" rx="2" stroke="currentColor" stroke-width="1.8" width="16" x="4" y="7"></rect><path d="M9 9V6a3 3 0 0 1 6 0v3" fill="none" stroke="currentColor" stroke-width="1.8"></path></symbol>
<symbol id="icon-wallet" viewbox="0 0 24 24"><rect fill="none" height="15" rx="3" stroke="currentColor" stroke-width="1.8" width="18" x="3" y="5"></rect><path d="M15 10h6v6h-6a3 3 0 0 1 0-6" fill="none" stroke="currentColor" stroke-width="1.8"></path></symbol>
<symbol id="icon-lock" viewbox="0 0 24 24"><rect fill="none" height="12" rx="2" stroke="currentColor" stroke-width="1.8" width="16" x="4" y="10"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="1.8"></path></symbol>
<symbol id="icon-copy" viewbox="0 0 24 24"><rect fill="none" height="13" rx="2" stroke="currentColor" stroke-width="1.7" width="12" x="8" y="8"></rect><path d="M16 8V5a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h2" fill="none" stroke="currentColor" stroke-width="1.7"></path></symbol>
<symbol id="icon-image" viewbox="0 0 24 24"><rect fill="none" height="16" rx="2" stroke="currentColor" stroke-width="1.8" width="18" x="3" y="4"></rect><circle cx="8" cy="9" fill="none" r="2" stroke="currentColor" stroke-width="1.8"></circle><path d="m4 18 5-5 3 3 4-5 5 5" fill="none" stroke="currentColor" stroke-width="1.8"></path></symbol>
<symbol id="icon-sliders" viewbox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-linecap="round" stroke-width="1.7"></path><circle cx="9" cy="6" fill="#102237" r="2" stroke="currentColor"></circle><circle cx="16" cy="12" fill="#102237" r="2" stroke="currentColor"></circle><circle cx="8" cy="18" fill="#102237" r="2" stroke="currentColor"></circle></symbol>
<symbol id="icon-plus" viewbox="0 0 24 24"><path d="M12 4v16M4 12h16" stroke="currentColor" stroke-linecap="round" stroke-width="2"></path></symbol>
<symbol id="icon-clock" viewbox="0 0 24 24"><circle cx="12" cy="12" fill="none" r="9" stroke="currentColor" stroke-width="1.8"></circle><path d="M12 6v7l4 2" fill="none" stroke="currentColor" stroke-width="1.8"></path></symbol>
<symbol id="icon-shield" viewbox="0 0 24 24"><path d="M12 2 20 5v6c0 5.5-4 9.5-8 11-4-1.5-8-5.5-8-11V5z" fill="none" stroke="currentColor" stroke-width="1.8"></path><path d="m8 12 3 3 5-6" fill="none" stroke="currentColor" stroke-width="1.8"></path></symbol>
<symbol id="icon-google" viewbox="0 0 24 24"><path d="M21.5 12.25c0-.7-.07-1.37-.18-2H12v3.84h5.33a4.56 4.56 0 0 1-2 2.98v2.48h3.2c1.88-1.74 2.97-4.3 2.97-7.3Z" fill="#4285f4"></path><path d="M12 22c2.7 0 4.96-.9 6.53-2.45l-3.2-2.48a5.95 5.95 0 0 1-8.88-3.13H3.17v2.55A10 10 0 0 0 12 22Z" fill="#34a853"></path><path d="M6.45 13.94a6 6 0 0 1 0-3.88V7.51H3.17a10 10 0 0 0 0 8.98Z" fill="#fbbc05"></path><path d="M12 6.05c1.43 0 2.72.49 3.73 1.46l2.8-2.8A9.65 9.65 0 0 0 12 2 10 10 0 0 0 3.17 7.51l3.28 2.55A5.97 5.97 0 0 1 12 6.05Z" fill="#ea4335"></path></symbol>
</defs></svg>
  <div id="splash" class="splash" role="status" aria-live="polite">
    <div class="splash-art" aria-hidden="true"></div>
    <div class="splash-center">
      <img src="/assets/refills-icon.png" alt="Refills Shop" class="splash-logo">
      <div class="loading-track"><div class="loading-fill"></div></div>
      <p id="splashMessage">Cargando Refills Shop y sincronizando catálogo…</p>
      <button id="splashRetry" type="button" class="btn btn-primary hide">Reintentar conexión</button>
    </div>
  </div>
  <header class="header">
    <div class="wrap header-inner">
      <a class="brand" href="/inicio" data-link aria-label="Volver al inicio"><span class="brand-mark"><img src="/assets/refills-icon.png" alt="" width="44" height="44"></span><span class="brand-words">REFILLS <small>SHOP</small></span></a>
      <div class="header-tools">
        <div id="balanceChip" class="balance-chip" title="Saldo disponible para revendedores" aria-label="Saldo USDT"><span class="balance-coin" aria-hidden="true">₮</span><span class="balance-copy"><span class="balance-label">SALDO USDT</span><strong id="balanceValue">0.00</strong></span></div>
        <a class="header-action" href="/pedidos" data-link aria-label="Mis pedidos" title="Mis pedidos"><svg class="icon" aria-hidden="true"><use href="#icon-bag"></use></svg></a>
        <a class="header-action" href="/cuenta" data-link aria-label="Mi cuenta" title="Mi cuenta"><svg class="icon" aria-hidden="true"><use href="#icon-shield"></use></svg></a>
      </div>
    </div>
  </header>
  <nav class="topnav wrap" id="topnav" aria-label="Secciones de la tienda"></nav>
  <div class="mobile-admin-row wrap"><a class="mobile-admin-link" href="/admin" data-link aria-label="Abrir administración, requiere contraseña"><svg class="icon" aria-hidden="true"><use href="#icon-sliders"></use></svg> ADM temporal</a></div>
  <main id="app" class="wrap main-content"></main>
  <footer class="footer"><div class="wrap footer-inside"><b>REFILLS SHOP</b><span>Juegos, recargas y pedidos en un solo lugar.</span></div></footer>
  <nav class="bottom-nav" id="bottomnav" aria-label="Navegación móvil"></nav>
  <div id="modal" class="modal-root" aria-live="polite"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0"></script>
  <script defer src="/app.js"></script>
</body>
</html>
